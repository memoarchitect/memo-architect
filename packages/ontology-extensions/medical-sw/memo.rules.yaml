closureRules:
  - id: CR-MED-007
    description: "Every SoftwareRequirement must derive from a SystemRequirement"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: derives
      direction: incoming
      relatedKinds: [SystemRequirement]
      min: 1
    severity: error

  - id: CR-MED-011
    description: "Every Software must have a safetyClassification attribute"
    entity: Software
    rule:
      type: requireAttribute
      attribute: safetyClassification
    severity: error

  - id: CR-MED-014
    description: "Every SoftwareRequirement must be verified by at least one Test"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: verify
      direction: incoming
      relatedKinds: [Test]
      min: 1
    severity: warning

  - id: CR-MED-019
    description: "Every SoftwareItem must declare a safetyClass"
    entity: SoftwareItem
    rule:
      type: requireAttribute
      attribute: safetyClass
    severity: error

  - id: CR-MED-020
    description: "Every SOUPItem should be documented by at least one record or evidence link"
    entity: SOUPItem
    rule:
      type: requireRelationship
      relationship: documents
      direction: incoming
      relatedKinds: [DesignHistoryRecord, ReleaseBaseline, ChangeRecord]
      min: 1
    severity: warning

  - id: CR-MED-021
    description: "Every SoftwareAnomaly should be documented by at least one record or evidence link"
    entity: SoftwareAnomaly
    rule:
      type: requireRelationship
      relationship: documents
      direction: incoming
      relatedKinds: [DesignHistoryRecord, ChangeRecord]
      min: 1
    severity: warning

  - id: CR-MED-034
    description: "Every ReleaseBaseline should document at least one software realization or evaluation artifact"
    entity: ReleaseBaseline
    rule:
      type: requireRelationship
      relationship: documents
      direction: outgoing
      relatedKinds: [SoftwareSystem, SoftwareItem, SOUPEvaluation]
      min: 1
    severity: warning
