closureRules:
  - id: CR-MED-062
    description: "Every CybersecurityRequirement should be satisfied by at least one software, structure, or interface element"
    entity: CybersecurityRequirement
    rule:
      type: requireRelationship
      relationship: satisfy
      direction: incoming
      relatedKinds:
        - Software
        - SoftwareSystem
        - SoftwareItem
        - SoftwareComponent
        - LogicalComponent
        - DataInterface
        - SecureUpdateCapability
      min: 1
    severity: warning

  - id: CR-MED-063
    description: "Every ThreatModel should model at least one ThreatScenario"
    entity: ThreatModel
    rule:
      type: requireRelationship
      relationship: modelsThreat
      direction: outgoing
      relatedKinds: [ThreatScenario]
      min: 1
    severity: warning

  - id: CR-MED-064
    description: "Every ThreatScenario should threaten at least one CyberAsset"
    entity: ThreatScenario
    rule:
      type: requireRelationship
      relationship: threatensAsset
      direction: outgoing
      relatedKinds: [CyberAsset]
      min: 1
    severity: warning

  - id: CR-MED-065
    description: "Every ThreatScenario should exploit at least one Vulnerability"
    entity: ThreatScenario
    rule:
      type: requireRelationship
      relationship: exploitsVulnerability
      direction: outgoing
      relatedKinds: [Vulnerability]
      min: 1
    severity: warning

  - id: CR-MED-066
    description: "Every SecurityControl should mitigate at least one ThreatScenario"
    entity: SecurityControl
    rule:
      type: requireRelationship
      relationship: mitigatesThreat
      direction: outgoing
      relatedKinds: [ThreatScenario]
      min: 1
    severity: warning

  - id: CR-MED-067
    description: "Every SecurityControl should secure at least one DataInterface"
    entity: SecurityControl
    rule:
      type: requireRelationship
      relationship: securesInterface
      direction: outgoing
      min: 1
    severity: warning

  - id: CR-MED-068
    description: "Every TerminologyBinding should bind at least one DataInterface or ClinicalObservation"
    entity: TerminologyBinding
    rule:
      type: requireRelationship
      relationship: bindsTerminology
      direction: outgoing
      min: 1
    severity: warning

  - id: CR-MED-069
    description: "Every TerminologyBinding should reference at least one ClinicalCodeSystemReference"
    entity: TerminologyBinding
    rule:
      type: requireRelationship
      relationship: referencesCodeSystem
      direction: outgoing
      relatedKinds: [ClinicalCodeSystemReference]
      min: 1
    severity: warning

  - id: CR-MED-070
    description: "Every TerminologyBinding should reference at least one ClinicalValueSetReference"
    entity: TerminologyBinding
    rule:
      type: requireRelationship
      relationship: referencesValueSet
      direction: outgoing
      relatedKinds: [ClinicalValueSetReference]
      min: 1
    severity: warning

  - id: CR-MED-071
    description: "Every ClinicalConceptMapReference should identify at least one source code system"
    entity: ClinicalConceptMapReference
    rule:
      type: requireRelationship
      relationship: mapsSourceCodeSystem
      direction: outgoing
      relatedKinds: [ClinicalCodeSystemReference]
      min: 1
    severity: warning

  - id: CR-MED-072
    description: "Every ClinicalConceptMapReference should identify at least one target code system"
    entity: ClinicalConceptMapReference
    rule:
      type: requireRelationship
      relationship: mapsTargetCodeSystem
      direction: outgoing
      relatedKinds: [ClinicalCodeSystemReference]
      min: 1
    severity: warning

  - id: CR-MED-073
    description: "Every SBOMArtifact should describe at least one software subject"
    entity: SBOMArtifact
    rule:
      type: requireRelationship
      relationship: maintainsSbom
      direction: outgoing
      relatedKinds: [SoftwareSystem, SoftwareItem, SOUPItem]
      min: 1
    severity: warning

  - id: CR-MED-074
    description: "Every SecureUpdateCapability should support at least one software or cyber asset subject"
    entity: SecureUpdateCapability
    rule:
      type: requireRelationship
      relationship: supportsSecureUpdate
      direction: outgoing
      relatedKinds: [SoftwareSystem, SoftwareItem, CyberAsset]
      min: 1
    severity: warning
