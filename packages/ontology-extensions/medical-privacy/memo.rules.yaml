closureRules:
  - id: CR-MED-098
    description: "Every DataProcessingActivity should process at least one data-bearing subject"
    entity: DataProcessingActivity
    rule:
      type: requireRelationship
      relationship: processesData
      direction: outgoing
      min: 1
    severity: warning

  - id: CR-MED-099
    description: "Every DataProcessingActivity should be governed by at least one processing basis"
    entity: DataProcessingActivity
    rule:
      type: requireRelationship
      relationship: governedByProcessingBasis
      direction: outgoing
      relatedKinds: [ProcessingBasis, LawfulBasis, HIPAAPermissionBasis]
      min: 1
    severity: warning

  - id: CR-MED-100
    description: "Every DataProcessingActivity should declare at least one data controller role"
    entity: DataProcessingActivity
    rule:
      type: requireRelationship
      relationship: controlsProcessing
      direction: incoming
      relatedKinds: [DataControllerRole]
      min: 1
    severity: warning

  - id: CR-MED-101
    description: "Every PersonalDataCategory should classify at least one governed subject"
    entity: PersonalDataCategory
    rule:
      type: requireRelationship
      relationship: classifiesData
      direction: outgoing
      min: 1
    severity: warning

  - id: CR-MED-102
    description: "Every ConsentRecord should support at least one governed subject"
    entity: ConsentRecord
    rule:
      type: requireRelationship
      relationship: requiresConsent
      direction: incoming
      min: 1
    severity: warning

  - id: CR-MED-103
    description: "Every DataRetentionPolicy should govern at least one subject"
    entity: DataRetentionPolicy
    rule:
      type: requireRelationship
      relationship: governedByRetentionPolicy
      direction: incoming
      min: 1
    severity: warning

  - id: CR-MED-104
    description: "Every PrivacyImpactAssessment should assess at least one processing or interface subject"
    entity: PrivacyImpactAssessment
    rule:
      type: requireRelationship
      relationship: assessesPrivacyImpact
      direction: outgoing
      min: 1
    severity: warning

  - id: CR-MED-105
    description: "Every ImportedTerminologySubset should scope at least one ClinicalCodeSystemReference"
    entity: ImportedTerminologySubset
    rule:
      type: requireRelationship
      relationship: scopesTerminologyReference
      direction: outgoing
      relatedKinds: [ClinicalCodeSystemReference]
      min: 1
    severity: warning

  - id: CR-MED-106
    description: "Every TerminologyImportBoundary should govern at least one terminology or import subject"
    entity: TerminologyImportBoundary
    rule:
      type: requireRelationship
      relationship: governedByImportBoundary
      direction: outgoing
      min: 1
    severity: warning

  - id: CR-MED-107
    description: "Every ImportProvenanceRecord should provide provenance for at least one imported terminology artifact"
    entity: ImportProvenanceRecord
    rule:
      type: requireRelationship
      relationship: providesImportProvenance
      direction: outgoing
      min: 1
    severity: warning

  - id: CR-MED-108
    description: "Every TerminologyBinding should bind at least one ImportedConceptBinding when imported terminology subsets are modeled"
    entity: TerminologyBinding
    rule:
      type: requireRelationship
      relationship: bindsImportedConcept
      direction: outgoing
      relatedKinds: [ImportedConceptBinding]
      min: 1
    severity: warning

  - id: CR-MED-109
    description: "Every MinimumNecessaryPolicy should apply to at least one DataProcessingActivity"
    entity: MinimumNecessaryPolicy
    rule:
      type: requireRelationship
      relationship: appliesMinimumNecessary
      direction: incoming
      relatedKinds: [DataProcessingActivity]
      min: 1
    severity: warning
