closureRules:
  - id: CR-MED-001
    description: "Every Hazard must have at least one mitigates relationship (ISO 14971 §6)"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: mitigates
      direction: incoming
      relatedKinds: [RiskControl]
      min: 1
    severity: error

  - id: CR-MED-002
    description: "Every Hazard must cause at least one HazardousSituation"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: causes
      direction: outgoing
      relatedKinds: [HazardousSituation]
      min: 1
    severity: error

  - id: CR-MED-003
    description: "Every RiskControl must be verified by at least one Test"
    entity: RiskControl
    rule:
      type: requireRelationship
      relationship: verify
      direction: incoming
      relatedKinds: [Test]
      min: 1
    severity: error

  - id: CR-MED-004
    description: "Every Risk must identify at least one Hazard"
    entity: Risk
    rule:
      type: requireRelationship
      relationship: identifies
      direction: outgoing
      relatedKinds: [Hazard]
      min: 1
    severity: error

  - id: CR-MED-005
    description: "Every HazardousSituation must be caused by a Hazard"
    entity: HazardousSituation
    rule:
      type: requireRelationship
      relationship: causes
      direction: incoming
      relatedKinds: [Hazard]
      min: 1
    severity: error

  - id: CR-MED-006
    description: "Every Harm must be led to by a HazardousSituation"
    entity: Harm
    rule:
      type: requireRelationship
      relationship: leadsTo
      direction: incoming
      relatedKinds: [HazardousSituation]
      min: 1
    severity: warning

  - id: CR-MED-040
    description: "Every FailureModesAndEffectsAnalysis should analyze at least one FailureMode"
    entity: FailureModesAndEffectsAnalysis
    rule:
      type: requireRelationship
      relationship: analyzesFailureMode
      direction: outgoing
      relatedKinds: [FailureMode]
      min: 1
    severity: warning

  - id: CR-MED-041
    description: "Every FailureMode should have at least one FailureCause"
    entity: FailureMode
    rule:
      type: requireRelationship
      relationship: hasFailureCause
      direction: outgoing
      relatedKinds: [FailureCause]
      min: 1
    severity: warning

  - id: CR-MED-042
    description: "Every FailureMode should result in at least one FailureEffect"
    entity: FailureMode
    rule:
      type: requireRelationship
      relationship: resultsInFailureEffect
      direction: outgoing
      relatedKinds: [FailureEffect]
      min: 1
    severity: warning

  - id: CR-MED-043
    description: "Every FailureEffect should escalate to at least one Hazard or HazardousSituation"
    entity: FailureEffect
    rule:
      type: requireRelationship
      relationship: escalatesToRisk
      direction: outgoing
      relatedKinds: [Hazard, HazardousSituation]
      min: 1
    severity: warning

  - id: CR-MED-044
    description: "Every FaultTreeAnalysis should define at least one TopEvent"
    entity: FaultTreeAnalysis
    rule:
      type: requireRelationship
      relationship: definesTopEvent
      direction: outgoing
      relatedKinds: [TopEvent]
      min: 1
    severity: warning

  - id: CR-MED-045
    description: "Every TopEvent should have at least one contributing FaultTreeContributor"
    entity: TopEvent
    rule:
      type: requireRelationship
      relationship: contributesToEvent
      direction: incoming
      relatedKinds: [FaultTreeContributor]
      min: 1
    severity: warning

  - id: CR-MED-046
    description: "Every TopEvent should trigger at least one HazardousSituation"
    entity: TopEvent
    rule:
      type: requireRelationship
      relationship: triggersHazardousSituation
      direction: outgoing
      relatedKinds: [HazardousSituation]
      min: 1
    severity: warning

  - id: CR-MED-056
    description: "Every RiskManagementPlan should plan at least one risk-management subject"
    entity: RiskManagementPlan
    rule:
      type: requireRelationship
      relationship: plansRiskManagement
      direction: outgoing
      relatedKinds:
        - Risk
        - FailureModesAndEffectsAnalysis
        - FaultTreeAnalysis
        - ResidualRiskEvaluation
        - BenefitRiskAssessment
      min: 1
    severity: warning

  - id: CR-MED-057
    description: "Every ResidualRiskEvaluation should assess at least one Risk, HazardousSituation, or Harm"
    entity: ResidualRiskEvaluation
    rule:
      type: requireRelationship
      relationship: assessesResidualRisk
      direction: outgoing
      relatedKinds: [Risk, HazardousSituation, Harm]
      min: 1
    severity: warning

  - id: CR-MED-058
    description: "Every BenefitRiskAssessment should weigh at least one ClinicalBenefit"
    entity: BenefitRiskAssessment
    rule:
      type: requireRelationship
      relationship: weighsAgainstBenefit
      direction: outgoing
      relatedKinds: [ClinicalBenefit]
      min: 1
    severity: warning

  - id: CR-MED-059
    description: "Every BenefitRiskAssessment should conclude at least one ResidualRiskEvaluation or OverallResidualRiskEvaluation"
    entity: BenefitRiskAssessment
    rule:
      type: requireRelationship
      relationship: concludesBenefitRisk
      direction: outgoing
      relatedKinds: [ResidualRiskEvaluation, OverallResidualRiskEvaluation]
      min: 1
    severity: warning

  - id: CR-MED-060
    description: "Every RiskManagementReport should conclude at least one OverallResidualRiskEvaluation"
    entity: RiskManagementReport
    rule:
      type: requireRelationship
      relationship: concludesOverallResidualRisk
      direction: outgoing
      relatedKinds: [OverallResidualRiskEvaluation]
      min: 1
    severity: warning

  - id: CR-MED-061
    description: "Every ProductionPostProductionSignal should monitor at least one regulated risk subject"
    entity: ProductionPostProductionSignal
    rule:
      type: requireRelationship
      relationship: monitorsRiskSubject
      direction: outgoing
      relatedKinds: [Risk, Hazard, Harm, RiskControl, SecurityControl]
      min: 1
    severity: warning
