closureRules:
  - id: CR-MED-075
    description: "Every ClinicalPerformanceClaim should reference at least one intended use or indication"
    entity: ClinicalPerformanceClaim
    rule:
      type: requireRelationship
      relationship: claimsForUse
      direction: outgoing
      relatedKinds: [IntendedUse]
      min: 1
    severity: warning

  - id: CR-MED-076
    description: "Every ClinicalPerformanceClaim should be supported by at least one clinical evidence artifact"
    entity: ClinicalPerformanceClaim
    rule:
      type: requireRelationship
      relationship: supportsClinicalClaim
      direction: incoming
      min: 1
    severity: warning

  - id: CR-MED-077
    description: "Every ClinicalSafetyClaim should reference at least one intended use or indication"
    entity: ClinicalSafetyClaim
    rule:
      type: requireRelationship
      relationship: claimsForUse
      direction: outgoing
      relatedKinds: [IntendedUse]
      min: 1
    severity: warning

  - id: CR-MED-078
    description: "Every ClinicalSafetyClaim should be evaluated by at least one clinical evaluation report"
    entity: ClinicalSafetyClaim
    rule:
      type: requireRelationship
      relationship: evaluatesClinicalClaim
      direction: incoming
      relatedKinds: [ClinicalEvaluationReport]
      min: 1
    severity: warning

  - id: CR-MED-079
    description: "Every ClinicalEvaluationPlan should plan at least one clinical claim"
    entity: ClinicalEvaluationPlan
    rule:
      type: requireRelationship
      relationship: plansClinicalEvaluation
      direction: outgoing
      relatedKinds: [ClinicalPerformanceClaim, ClinicalSafetyClaim]
      min: 1
    severity: warning

  - id: CR-MED-049
    description: "Every TreatmentPathway should contain at least one Procedure or ClinicalStep"
    entity: TreatmentPathway
    rule:
      type: requireRelationship
      relationship: hasSubProcedure
      direction: outgoing
      relatedKinds: [Procedure, ClinicalStep]
      min: 1
    severity: warning

  - id: CR-MED-050
    description: "Every ProcedureMethod should be used by at least one Procedure"
    entity: ProcedureMethod
    rule:
      type: requireRelationship
      relationship: usesMethod
      direction: incoming
      relatedKinds: [Procedure, ClinicalStep, TreatmentPathway]
      min: 1
    severity: warning

  - id: CR-MED-051
    description: "Every RouteOfAdministration should be used by at least one Procedure"
    entity: RouteOfAdministration
    rule:
      type: requireRelationship
      relationship: usesRoute
      direction: incoming
      relatedKinds: [Procedure, ClinicalStep, TreatmentPathway]
      min: 1
    severity: warning

  - id: CR-MED-052
    description: "Every ClinicalObservation should be produced by at least one Procedure"
    entity: ClinicalObservation
    rule:
      type: requireRelationship
      relationship: producesObservation
      direction: incoming
      relatedKinds: [Procedure, ClinicalStep, TreatmentPathway]
      min: 1
    severity: warning

  - id: CR-MED-053
    description: "Every ClinicalObservation should observe at least one Patient, AnatomicalSite, or MorphologyState"
    entity: ClinicalObservation
    rule:
      type: requireRelationship
      relationship: observesSubject
      direction: outgoing
      relatedKinds: [Patient, AnatomicalSite, MorphologyState]
      min: 1
    severity: warning

  - id: CR-MED-054
    description: "Every MorphologyState should be affected by at least one Procedure"
    entity: MorphologyState
    rule:
      type: requireRelationship
      relationship: affectsMorphology
      direction: incoming
      relatedKinds: [Procedure, ClinicalStep, TreatmentPathway]
      min: 1
    severity: warning

  - id: CR-MED-055
    description: "Every UseEnvironment should declare at least one ClinicalEnvironmentQualifier"
    entity: UseEnvironment
    rule:
      type: requireRelationship
      relationship: appliesEnvironmentQualifier
      direction: outgoing
      relatedKinds: [ClinicalEnvironmentQualifier]
      min: 1
    severity: warning
