# @memo/medical — Medical workbench package
# Extends @memo/ontology-medical with:
#   - closure rules
#   - medical viewpoints
#   - starter scaffolding
#   - closure rules, viewpoints, and starter scaffolding only

projectName: "@memo/medical"
projectType: device

ontologies:
  - name: memo-ontology-medical
    version: "^0.1.0"

extends: "@memo/ontology-medical"

ontologyMetadata:
  id: "@memo/medical"
  version: "2.0.0"
  description: "Medical workbench package — closure rules, viewpoints, and starter templates on top of @memo/ontology-medical"
  author: "SysAnd"
  license: "Apache-2.0"
  tags:
    - medical-device
    - ISO-14971
    - IEC-62304
    - IEC-60601
    - workbench

closureRules:
  - id: CR-MED-001
    description: "Every Hazard must have at least one mitigates relationship (ISO 14971 §6)"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: mitigates
      min: 1
    severity: error

  - id: CR-MED-002
    description: "Every Hazard must cause at least one HazardousSituation"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: causes
      min: 1
    severity: error

  - id: CR-MED-003
    description: "Every RiskControl must be verified by at least one Test"
    entity: RiskControl
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: error

  - id: CR-MED-004
    description: "Every Risk must identify at least one Hazard"
    entity: Risk
    rule:
      type: requireRelationship
      relationship: identifies
      min: 1
    severity: error

  - id: CR-MED-005
    description: "Every HazardousSituation must be caused by a Hazard"
    entity: HazardousSituation
    rule:
      type: requireRelationship
      relationship: causes
      min: 1
    severity: error

  - id: CR-MED-006
    description: "Every Harm must be led to by a HazardousSituation"
    entity: Harm
    rule:
      type: requireRelationship
      relationship: leadsTo
      min: 1
    severity: warning

  - id: CR-MED-007
    description: "Every SoftwareRequirement must derive from a SystemRequirement"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: derives
      min: 1
    severity: error

  - id: CR-MED-008
    description: "Every SystemRequirement should derive from a UserNeed"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: derives
      min: 1
    severity: warning

  - id: CR-MED-009
    description: "Every SystemRequirement should be satisfied by a LogicalComponent"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: satisfy
      min: 1
    severity: warning

  - id: CR-MED-010
    description: "Every SystemFunction must be allocated to a LogicalComponent or Software"
    entity: SystemFunction
    rule:
      type: requireRelationship
      relationship: allocateTo
      min: 1
    severity: error

  - id: CR-MED-011
    description: "Every Software must have a safetyClassification attribute"
    entity: Software
    rule:
      type: requireAttribute
      attribute: safetyClassification
    severity: error

  - id: CR-MED-012
    description: "Every UseCase should be refined by at least one Scenario"
    entity: UseCase
    rule:
      type: requireRelationship
      relationship: refines
      min: 1
    severity: warning

  - id: CR-MED-013
    description: "Every SystemRequirement must be verified by at least one Test"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: warning

  - id: CR-MED-014
    description: "Every SoftwareRequirement must be verified by at least one Test"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: warning

  - id: CR-MED-015
    description: "Every UserNeed should derive at least one SystemRequirement"
    entity: UserNeed
    rule:
      type: requireRelationship
      relationship: derives
      min: 1
    severity: warning

  - id: CR-MED-016
    description: "Every EssentialPerformance claim should be preserved by at least one SafetyFunction"
    entity: EssentialPerformance
    rule:
      type: requireRelationship
      relationship: preserves
      min: 1
    severity: warning

  - id: CR-MED-017
    description: "Every UserInterfaceRequirement should address at least one UseError"
    entity: UserInterfaceRequirement
    rule:
      type: requireRelationship
      relationship: addressesUseError
      min: 1
    severity: warning

  - id: CR-MED-018
    description: "Every UserInterfaceRequirement should be verified by at least one Test"
    entity: UserInterfaceRequirement
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: warning

  - id: CR-MED-019
    description: "Every SoftwareItem must declare a safetyClass"
    entity: SoftwareItem
    rule:
      type: requireAttribute
      attribute: safetyClass
    severity: error

  - id: CR-MED-020
    description: "Every SOUPItem should be documented by at least one record or evidence link"
    entity: SOUPItem
    rule:
      type: requireRelationship
      relationship: documents
      min: 1
    severity: warning

  - id: CR-MED-021
    description: "Every SoftwareAnomaly should be documented by at least one record or evidence link"
    entity: SoftwareAnomaly
    rule:
      type: requireRelationship
      relationship: documents
      min: 1
    severity: warning

viewpoints:
  - id: risk-overview
    label: Risk Overview (ISO 14971)
    supportedDiagramTypes: [risk, req, pkg]
    visibleKinds:
      - Hazard
      - HazardousSituation
      - Harm
      - Risk
      - RiskControl
      - SafetyGoal
    visibleRelationships:
      - mitigates
      - causes
      - leadsTo
      - identifies
      - contributesToHazard
    visibleLayers:
      - risk
      - safety
    diagrams:
      - id: diag-risk-chain
        name: Risk Mitigation Chain
        diagramType: risk
        viewpointId: risk-overview
        auto: true
        description: Hazard to RiskControl to Test mitigation chain

  - id: safety-view
    label: Safety Analysis
    supportedDiagramTypes: [bdd, req, pkg]
    visibleKinds:
      - SafetyGoal
      - EssentialPerformance
      - BasicSafety
      - PrimaryOperatingFunction
      - EssentialPerformanceLossCondition
      - RiskControl
      - Hazard
      - UserInterfaceRequirement
      - UseError
      - CollateralStandardRequirement
      - ParticularStandardRequirement
      - FormativeEvaluation
      - SummativeEvaluation
      - SystemFunction
      - ComponentFunction
      - Test
    visibleRelationships:
      - mitigates
      - preserves
      - addressesUseError
      - allocateTo
      - supportsOperatingFunction
      - definesLossCondition
      - protectsEssentialPerformance
      - implementsRiskControl
      - appliesStandardRequirement
      - verify
    visibleLayers:
      - risk
      - safety
      - functional
      - verification
    diagrams:
      - id: diag-safety-mitigation
        name: Safety Mitigation
        diagramType: bdd
        viewpointId: safety-view
        auto: true
        description: Safety goals linked to risk controls, functions, and verification tests

  - id: software-view
    label: Software Architecture
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - Software
      - SoftwareSystem
      - SoftwareItem
      - SoftwareUnit
      - SOUPItem
      - SoftwareAnomaly
      - MaintenanceRelease
      - SoftwareLifecycleProcess
      - SoftwareLifecycleActivity
      - SoftwareDevelopmentProcess
      - SoftwareMaintenanceProcess
      - SoftwareRiskManagementProcess
      - SoftwareRequirementsAnalysisActivity
      - SoftwareArchitecturalDesignActivity
      - SoftwareDetailedDesignActivity
      - SoftwareUnitImplementationActivity
      - SoftwareVerificationActivity
      - ProblemResolutionActivity
      - SoftwareWorkProduct
      - SoftwareRequirementsArtifact
      - SoftwareDevelopmentPlan
      - SoftwareArchitectureArtifact
      - SoftwareDetailedDesign
      - SOUPEvaluation
      - SoftwareProblemReport
      - ChangeImpactAssessment
      - SoftwareComponent
      - SoftwareModule
      - Firmware
      - Docker
      - OperatingSystem
      - RosNode
      - RosTopic
      - RosService
      - Interface
      - InterfaceContract
    visibleRelationships:
      - aggregation
      - composedOf
      - dependency
      - realization
      - documents
      - governsActivity
      - producesWorkProduct
    visibleLayers:
      - software
      - software-lifecycle
      - interfaces
    diagrams:
      - id: diag-sw-decomposition
        name: Software Decomposition
        diagramType: bdd
        viewpointId: software-view
        auto: true
        description: Software components and lifecycle decomposition

  - id: usability-view
    label: Usability Engineering (IEC 62366 / IEC 60601-1-6)
    supportedDiagramTypes: [req, act, bdd, pkg]
    visibleKinds:
      - UserNeed
      - UserProfile
      - UseEnvironment
      - UserActivity
      - UserInterfaceRequirement
      - UseError
      - UseSpecification
      - UseErrorAnalysis
      - HazardRelatedUseScenario
      - UsabilitySpecification
      - UsabilityValidation
      - FormativeEvaluation
      - SummativeEvaluation
      - EssentialPerformance
      - BasicSafety
      - Test
    visibleRelationships:
      - derives
      - refines
      - addressesUseError
      - analyzesUseError
      - specifiesScenario
      - exposesUseError
      - evaluatesRequirement
      - contributesToHazard
      - preserves
      - verify
    visibleLayers:
      - requirements
      - design-control
      - operational
      - risk
      - safety
      - verification
    diagrams:
      - id: diag-usability-trace
        name: Usability Trace
        diagramType: req
        viewpointId: usability-view
        auto: true
        description: User needs, use errors, usability requirements, and validation trace

  - id: physical-view
    label: Physical Architecture
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - PhysicalComponent
      - ElectricalComponent
      - MechanicalComponent
      - HardwareNode
      - ComputingDevice
      - PhysicalModule
      - FPGA
      - Microcontroller
      - SingleBoardComputer
      - Catheter
    visibleRelationships:
      - aggregation
      - composedOf
      - association
    visibleLayers:
      - physical
    diagrams:
      - id: diag-phy-bom
        name: Physical BOM
        diagramType: bdd
        viewpointId: physical-view
        auto: true
        description: Physical components and hardware nodes
      - id: diag-phy-containment
        name: Physical Containment
        diagramType: ibd
        viewpointId: physical-view
        auto: true
        description: Physical system breakdown — nested containment view
        properties:
          layoutStyle: ibd

firstRun:
  template: infusion-pump
  promptForMetadata: true
  scaffoldFiles:
    - infusion-pump.sysml
