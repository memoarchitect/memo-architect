  SoftwareComponent:
    label: Software Component
    layer: software
    sysmlConstruct: part def

  SoftwareModule:
    label: Software Module
    layer: software
    sysmlConstruct: part def

  Firmware:
    label: Firmware
    layer: software
    sysmlConstruct: part def

  Docker:
    label: Docker
    layer: software
    sysmlConstruct: part def

  OperatingSystem:
    label: Operating System
    layer: software
