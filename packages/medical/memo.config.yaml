  # ── Interfaces & Ports ───────────────────────────────────────────────────
  Port:
    label: Port
    layer: interfaces
    sysmlConstruct: port def

  PortEthernet:
    label: Ethernet Port
    layer: interfaces
    sysmlConstruct: port def

  PortUSB:
    label: USB Port
    layer: interfaces
    sysmlConstruct: port def

  PortSerial:
    label: Serial Port
    layer: interfaces
    sysmlConstruct: port def

  PortPower:
    label: Power Port
    layer: interfaces
    sysmlConstruct: port def

  Interface:
    label: Interface
    layer: interfaces
    sysmlConstruct: interface def

  SoftwareInterface:
    label: Software Interface
    layer: interfaces
    sysmlConstruct: interface def

  SoftwareProvidedInterface:
    label: Provided Interface
    layer: interfaces
    sysmlConstruct: interface def

  SoftwareRequiredInterface:
    label: Required Interface
    layer: interfaces
    sysmlConstruct: interface def

  RosTopic:
    label: ROS Topic
    layer: interfaces
    sysmlConstruct: interface def

  RosService:
    label: ROS Service
    layer: interfaces
    sysmlConstruct: interface def

  # ── UI Wireframe ─────────────────────────────────────────────────────────
  UIScreen:
    label: UI Screen
    layer: ui
    sysmlConstruct: part def

  UIPanel:
    label: UI Panel
    layer: ui
    sysmlConstruct: part def

  UIElement:
    label: UI Element
    layer: ui
    sysmlConstruct: part def

  # ── Verification ─────────────────────────────────────────────────────────
  Test:
    label: Test
    layer: verification
    sysmlConstruct: part def

  # ── Cross-cutting ────────────────────────────────────────────────────────
  Standard:
    label: Standard
    layer: requirements
    sysmlConstruct: part def

  RegulatoryRequirement:
    label: Regulatory Requirement
    layer: requirements
