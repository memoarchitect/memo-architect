  - name: association
    label: Association
    layer: logical
    color: "#9B59B6"

  - name: traceTo
    label: Trace To
    layer: requirements
    color: "#4A90D9"

  - name: trace
    label: Trace
    layer: requirements
    color: "#3498DB"

  - name: allocateTo
    label: Allocate To
    layer: functional
    color: "#E67E22"

  - name: composedOf
    label: Composed Of
    layer: logical
    color: "#8E44AD"

  - name: dependency
    label: Dependency
    layer: logical
    color: "#95A5A6"

  - name: realization
    label: Realization
    layer: logical
    color: "#2C3E50"

  - name: satisfy
    label: Satisfies
    layer: requirements
    color: "#2ECC71"

  - name: verify
    label: Verifies
    layer: verification
    color: "#27AE60"

  - name: mitigates
    label: Mitigates
    layer: risk
    color: "#E74C3C"

  - name: causes
    label: Causes
    layer: risk
    color: "#C0392B"

  - name: leadsTo
    label: Leads To
    layer: risk
    color: "#E74C3C"

  - name: identifies
    label: Identifies
    layer: risk
    color: "#D35400"

  - name: extend
    label: Extends
    layer: functional
    color: "#F39C12"

  - name: include
    label: Includes
    layer: functional
    color: "#F1C40F"

# ─── Backward-Compatible Flat Relationship List ──────────────────────────────

relationships:
  - aggregation
  - association
  - traceTo
  - trace
  - allocateTo
  - composedOf
  - dependency
  - realization
  - satisfy
  - verify
  - mitigates
  - causes
  - leadsTo
  - identifies
  - extend
  - include

# ─── Closure Rules ────────────────────────────────────────────────────────────

closureRules:
  # Risk management (ISO 14971)
  - id: CR-MED-001
    description: "Every Hazard must have at least one mitigates relationship (ISO 14971 §6)"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: mitigates
      min: 1
    severity: error

  - id: CR-MED-002
    description: "Every Hazard must trace to at least one SystemFunction or UseCase"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: error

  - id: CR-MED-003
    description: "Every RiskControl must be verified by at least one Test"
    entity: RiskControl
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: error

  - id: CR-MED-004
    description: "Every Risk must identify at least one Hazard"
    entity: Risk
    rule:
      type: requireRelationship
      relationship: identifies
      min: 1
    severity: error

  - id: CR-MED-005
    description: "Every HazardousSituation must be caused by a Hazard"
    entity: HazardousSituation
    rule:
      type: requireRelationship
      relationship: causes
      min: 1
    severity: error

  - id: CR-MED-006
    description: "Every Harm must be led to by a HazardousSituation"
    entity: Harm
    rule:
      type: requireRelationship
      relationship: leadsTo
      min: 1
    severity: warning

  # Requirements traceability (IEC 62304)
  - id: CR-MED-007
    description: "Every SoftwareRequirement must trace to a SystemRequirement"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: error

  - id: CR-MED-008
    description: "Every SystemRequirement must trace to a UserNeed"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: warning

  - id: CR-MED-009
    description: "Every SystemRequirement should be satisfied by a Component"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: satisfy
      min: 1
    severity: warning

  # Architecture completeness
  - id: CR-MED-010
    description: "Every SystemFunction must be allocated to a Component or Software"
    entity: SystemFunction
    rule:
      type: requireRelationship
      relationship: allocateTo
      min: 1
    severity: error

  - id: CR-MED-011
    description: "Every Software must have a safetyClassification attribute"
    entity: Software
    rule:
      type: requireAttribute
      attribute: safetyClassification
    severity: error

  - id: CR-MED-012
    description: "Every UseCase must trace to at least one Scenario"
    entity: UseCase
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: warning

  # Verification
  - id: CR-MED-013
    description: "Every SystemRequirement must be verified by at least one Test"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: warning

  - id: CR-MED-014
    description: "Every SoftwareRequirement must be verified by at least one Test"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: warning

  - id: CR-MED-015
    description: "Every UserNeed must trace to at least one UseCase"
    entity: UserNeed
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: warning

# ─── Viewpoints ───────────────────────────────────────────────────────────────

viewpoints:
  - id: risk-overview
    label: Risk Overview (ISO 14971)
    visibleKinds:
      - Hazard
      - HazardousSituation
      - Harm
      - Risk
      - RiskControl
      - SafetyGoal
    visibleRelationships:
      - mitigates
      - causes
      - leadsTo
      - identifies
    visibleLayers:
      - risk

  - id: requirements-trace
    label: Requirements Traceability
    visibleKinds:
      - UserNeed
      - SystemRequirement
      - SoftwareRequirement
      - HardwareRequirement
      - DesignSpecification
    visibleRelationships:
      - traceTo
      - trace
      - satisfy
    visibleLayers:
      - requirements

  - id: architecture-view
    label: System Architecture
    visibleKinds:
      - System
      - SystemExternal
      - Subsystem
      - Component
      - LogicalComponent
      - LogicalComponentExternal
      - SystemFunction
      - ComponentFunction
    visibleRelationships:
      - aggregation
      - composedOf
      - allocateTo
      - association
    visibleLayers:
      - logical
      - functional

  - id: software-view
    label: Software Architecture
    visibleKinds:
      - Software
      - SoftwareComponent
      - SoftwareModule
      - Firmware
      - Docker
      - OperatingSystem
      - RosNode
      - SoftwareInterface
      - RosTopic
      - RosService
    visibleRelationships:
      - aggregation
      - composedOf
      - dependency
      - realization
    visibleLayers:
      - software
      - interfaces

  - id: physical-view
    label: Physical Architecture
    visibleKinds:
      - PhysicalComponent
      - ElectricalComponent
      - MechanicalComponent
      - HardwareNode
      - ComputingDevice
      - PhysicalModule
    visibleRelationships:
      - aggregation
      - composedOf
      - association
    visibleLayers:
      - physical

  - id: v-and-v
    label: Verification & Validation
    visibleKinds:
      - Test
      - SystemRequirement
      - SoftwareRequirement
      - RiskControl
    visibleRelationships:
      - verify
      - satisfy
      - traceTo
    visibleLayers:
      - verification
      - requirements

  - id: use-case-view
    label: Use Case View
    visibleKinds:
      - Actor
      - UseCase
      - Scenario
      - UserActivity
      - UserNeed
    visibleRelationships:
      - association
      - traceTo
      - extend
      - include
    visibleLayers:
      - business
      - functional

# ─── First Run Configuration ─────────────────────────────────────────────────

firstRun:
  template: infusion-pump
  promptForMetadata: true
  scaffoldFiles:
    - infusion-pump.sysml
