# @memo/medical — Medical Device Domain Configuration (Comprehensive)
# ISO 14971 risk management, IEC 62304 software lifecycle, IEC 62366 usability
#
# Extends @memo/ontology (base MBSE) with medical-device-specific:
#   - Risk management layer + kinds (Hazard, Harm, RiskControl, etc.)
#   - UI wireframe layer + kinds
#   - Specialized hardware (FPGA, Catheter, Microcontroller)
#   - Specialized software (Firmware, Docker, ROS)
#   - 15 closure rules (ISO 14971 + IEC 62304)
#   - Medical-specific viewpoints

projectName: "@memo/medical"
projectType: device

ontologies:
  - name: memo-ontology
    version: "^2.0.0"

extends: "@memo/ontology"

ontologyMetadata:
  id: "@memo/medical"
  version: "2.0.0"
  description: "Comprehensive medical device ontology — ISO 14971, IEC 62304, IEC 62366"
  author: "SysAnd"
  license: "Apache-2.0"
  tags:
    - medical-device
    - ISO-14971
    - IEC-62304
    - IEC-62366

# ─── Additional CoSMA Layers (medical-specific) ──────────────────────────────

cosmaLayers:
  - id: risk
    label: Risk Management
    color: "#E74C3C"

  - id: ui
    label: UI Wireframe
    color: "#3498DB"

# ─── Medical-Specific Entity Kinds ───────────────────────────────────────────
# Only kinds NOT already in @memo/ontology base.

kinds:
  # ── Risk Management (ISO 14971) ────────────────────────────────────────
  Hazard:
    label: Hazard
    layer: risk
    sysmlConstruct: requirement def

  HazardousSituation:
    label: Hazardous Situation
    layer: risk
    sysmlConstruct: requirement def

  Harm:
    label: Harm
    layer: risk
    sysmlConstruct: requirement def
    defaultAttributes:
      severity: "Serious"

  Risk:
    label: Risk
    layer: risk
    sysmlConstruct: requirement def
    defaultAttributes:
      riskAcceptance: "NeedsReview"

  RiskControl:
    label: Risk Control
    layer: risk
    sysmlConstruct: requirement def

  SafetyGoal:
    label: Safety Goal
    layer: risk
    sysmlConstruct: requirement def

  # ── Functional (medical-specific) ──────────────────────────────────────
  UIFunction:
    label: UI Function
    layer: functional
    sysmlConstruct: action def

  # ── Physical (specialized hardware) ────────────────────────────────────
  Catheter:
    label: Catheter
    layer: physical
    sysmlConstruct: part def

  FPGA:
    label: FPGA
    layer: physical
    sysmlConstruct: part def

  Microcontroller:
    label: Microcontroller
    layer: physical
    sysmlConstruct: part def

  SingleBoardComputer:
    label: Single Board Computer
    layer: physical
    sysmlConstruct: part def

  # ── Software (specialized) ─────────────────────────────────────────────
  Software:
    label: Software
    layer: software
    sysmlConstruct: part def
    defaultAttributes:
      safetyClassification: "A"

  Firmware:
    label: Firmware
    layer: software
    sysmlConstruct: part def

  Docker:
    label: Docker
    layer: software
    sysmlConstruct: part def

  OperatingSystem:
    label: Operating System
    layer: software
    sysmlConstruct: part def

  RosNode:
    label: ROS Node
    layer: software
    sysmlConstruct: part def

  # ── Interfaces (specialized) ───────────────────────────────────────────
  RosTopic:
    label: ROS Topic
    layer: interfaces
    sysmlConstruct: interface def

  RosService:
    label: ROS Service
    layer: interfaces
    sysmlConstruct: interface def

  # ── UI Wireframe ───────────────────────────────────────────────────────
  UIScreen:
    label: UI Screen
    layer: ui
    sysmlConstruct: part def

  UIPanel:
    label: UI Panel
    layer: ui
    sysmlConstruct: part def

  UIElement:
    label: UI Element
    layer: ui
    sysmlConstruct: part def

# ─── Medical-Specific Relationship Types ─────────────────────────────────────

relationshipTypes:
  - name: mitigates
    label: Mitigates
    layer: risk
    color: "#E74C3C"

  - name: causes
    label: Causes
    layer: risk
    color: "#C0392B"

  - name: leadsTo
    label: Leads To
    layer: risk
    color: "#E74C3C"

  - name: identifies
    label: Identifies
    layer: risk
    color: "#D35400"

# ─── Backward-Compatible Flat Relationship List ──────────────────────────────

relationships:
  - mitigates
  - causes
  - leadsTo
  - identifies

# ─── Closure Rules ────────────────────────────────────────────────────────────

closureRules:
  # Risk management (ISO 14971)
  - id: CR-MED-001
    description: "Every Hazard must have at least one mitigates relationship (ISO 14971 §6)"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: mitigates
      min: 1
    severity: error

  - id: CR-MED-002
    description: "Every Hazard must trace to at least one SystemFunction or UseCase"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: error

  - id: CR-MED-003
    description: "Every RiskControl must be verified by at least one Test"
    entity: RiskControl
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: error

  - id: CR-MED-004
    description: "Every Risk must identify at least one Hazard"
    entity: Risk
    rule:
      type: requireRelationship
      relationship: identifies
      min: 1
    severity: error

  - id: CR-MED-005
    description: "Every HazardousSituation must be caused by a Hazard"
    entity: HazardousSituation
    rule:
      type: requireRelationship
      relationship: causes
      min: 1
    severity: error

  - id: CR-MED-006
    description: "Every Harm must be led to by a HazardousSituation"
    entity: Harm
    rule:
      type: requireRelationship
      relationship: leadsTo
      min: 1
    severity: warning

  # Requirements traceability (IEC 62304)
  - id: CR-MED-007
    description: "Every SoftwareRequirement must trace to a SystemRequirement"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: error

  - id: CR-MED-008
    description: "Every SystemRequirement must trace to a UserNeed"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: warning

  - id: CR-MED-009
    description: "Every SystemRequirement should be satisfied by a Component"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: satisfy
      min: 1
    severity: warning

  # Architecture completeness
  - id: CR-MED-010
    description: "Every SystemFunction must be allocated to a Component or Software"
    entity: SystemFunction
    rule:
      type: requireRelationship
      relationship: allocateTo
      min: 1
    severity: error

  - id: CR-MED-011
    description: "Every Software must have a safetyClassification attribute"
    entity: Software
    rule:
      type: requireAttribute
      attribute: safetyClassification
    severity: error

  - id: CR-MED-012
    description: "Every UseCase must trace to at least one Scenario"
    entity: UseCase
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: warning

  # Verification
  - id: CR-MED-013
    description: "Every SystemRequirement must be verified by at least one Test"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: warning

  - id: CR-MED-014
    description: "Every SoftwareRequirement must be verified by at least one Test"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: warning

  - id: CR-MED-015
    description: "Every UserNeed must trace to at least one UseCase"
    entity: UserNeed
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: warning

# ─── Viewpoints ───────────────────────────────────────────────────────────────
# Medical-specific viewpoints. Base viewpoints (architecture-view, requirements-trace,
# use-case-view, v-and-v) are inherited from @memo/ontology.

viewpoints:
  - id: risk-overview
    label: Risk Overview (ISO 14971)
    supportedDiagramTypes: [risk, req, pkg]
    visibleKinds:
      - Hazard
      - HazardousSituation
      - Harm
      - Risk
      - RiskControl
      - SafetyGoal
    visibleRelationships:
      - mitigates
      - causes
      - leadsTo
      - identifies
    visibleLayers:
      - risk
    diagrams:
      - id: diag-risk-chain
        name: Risk Mitigation Chain
        diagramType: risk
        viewpointId: risk-overview
        auto: true
        description: Hazard to RiskControl to Test mitigation chain

  - id: software-view
    label: Software Architecture
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - Software
      - SoftwareComponent
      - SoftwareModule
      - Firmware
      - Docker
      - OperatingSystem
      - RosNode
      - SoftwareInterface
      - RosTopic
      - RosService
    visibleRelationships:
      - aggregation
      - composedOf
      - dependency
      - realization
    visibleLayers:
      - software
      - interfaces
    diagrams:
      - id: diag-sw-decomposition
        name: Software Decomposition
        diagramType: bdd
        viewpointId: software-view
        auto: true
        description: Software components and modules hierarchy

  - id: physical-view
    label: Physical Architecture
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - PhysicalComponent
      - ElectricalComponent
      - MechanicalComponent
      - HardwareNode
      - ComputingDevice
      - PhysicalModule
    visibleRelationships:
      - aggregation
      - composedOf
      - association
    visibleLayers:
      - physical
    diagrams:
      - id: diag-phy-bom
        name: Physical BOM
        diagramType: bdd
        viewpointId: physical-view
        auto: true
        description: Physical components and hardware nodes

# ─── First Run Configuration ─────────────────────────────────────────────────

firstRun:
  template: infusion-pump
  promptForMetadata: true
  scaffoldFiles:
    - infusion-pump.sysml
