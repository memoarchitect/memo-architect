# @memo/medical — Medical workbench package
# Extends @memo/ontology-medical with:
#   - closure rules
#   - medical viewpoints
#   - starter scaffolding
#   - transitional compatibility kinds not yet moved into ontology-core/ontology-medical

projectName: "@memo/medical"
projectType: device

ontologies:
  - name: memo-ontology-medical
    version: "^0.1.0"

extends: "@memo/ontology-medical"

ontologyMetadata:
  id: "@memo/medical"
  version: "2.0.0"
  description: "Medical workbench package — closure rules, viewpoints, templates, and transitional compatibility kinds"
  author: "SysAnd"
  license: "Apache-2.0"
  tags:
    - medical-device
    - ISO-14971
    - IEC-62304
    - workbench

cosmaLayers:
  - id: ui
    label: UI Wireframe
    color: "#3498DB"

kinds:
  Standard:
    label: Standard
    layer: requirements
    sysmlConstruct: part def

  RegulatoryRequirement:
    label: Regulatory Requirement
    layer: requirements
    sysmlConstruct: part def

  UIFunction:
    label: UI Function
    layer: functional
    sysmlConstruct: action def

  Question:
    label: Question
    layer: logical
    sysmlConstruct: part def

  Catheter:
    label: Catheter
    layer: physical
    sysmlConstruct: part def

  Software:
    label: Software
    layer: software
    sysmlConstruct: part def
    defaultAttributes:
      safetyClassification: "A"

  Docker:
    label: Docker
    layer: software
    sysmlConstruct: part def

  RosNode:
    label: ROS Node
    layer: software
    sysmlConstruct: part def

  RosTopic:
    label: ROS Topic
    layer: interfaces
    sysmlConstruct: interface def

  RosService:
    label: ROS Service
    layer: interfaces
    sysmlConstruct: interface def

  UIScreen:
    label: UI Screen
    layer: ui
    sysmlConstruct: part def

  UIPanel:
    label: UI Panel
    layer: ui
    sysmlConstruct: part def

  UIElement:
    label: UI Element
    layer: ui
    sysmlConstruct: part def

closureRules:
  - id: CR-MED-001
    description: "Every Hazard must have at least one mitigates relationship (ISO 14971 §6)"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: mitigates
      min: 1
    severity: error

  - id: CR-MED-002
    description: "Every Hazard must trace to at least one SystemFunction or UseCase"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: error

  - id: CR-MED-003
    description: "Every RiskControl must be verified by at least one Test"
    entity: RiskControl
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: error

  - id: CR-MED-004
    description: "Every Risk must identify at least one Hazard"
    entity: Risk
    rule:
      type: requireRelationship
      relationship: identifies
      min: 1
    severity: error

  - id: CR-MED-005
    description: "Every HazardousSituation must be caused by a Hazard"
    entity: HazardousSituation
    rule:
      type: requireRelationship
      relationship: causes
      min: 1
    severity: error

  - id: CR-MED-006
    description: "Every Harm must be led to by a HazardousSituation"
    entity: Harm
    rule:
      type: requireRelationship
      relationship: leadsTo
      min: 1
    severity: warning

  - id: CR-MED-007
    description: "Every SoftwareRequirement must trace to a SystemRequirement"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: error

  - id: CR-MED-008
    description: "Every SystemRequirement must trace to a UserNeed"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: warning

  - id: CR-MED-009
    description: "Every SystemRequirement should be satisfied by a Component"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: satisfy
      min: 1
    severity: warning

  - id: CR-MED-010
    description: "Every SystemFunction must be allocated to a Component or Software"
    entity: SystemFunction
    rule:
      type: requireRelationship
      relationship: allocateTo
      min: 1
    severity: error

  - id: CR-MED-011
    description: "Every Software must have a safetyClassification attribute"
    entity: Software
    rule:
      type: requireAttribute
      attribute: safetyClassification
    severity: error

  - id: CR-MED-012
    description: "Every UseCase must trace to at least one Scenario"
    entity: UseCase
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: warning

  - id: CR-MED-013
    description: "Every SystemRequirement must be verified by at least one Test"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: warning

  - id: CR-MED-014
    description: "Every SoftwareRequirement must be verified by at least one Test"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: verify
      min: 1
    severity: warning

  - id: CR-MED-015
    description: "Every UserNeed must trace to at least one UseCase"
    entity: UserNeed
    rule:
      type: requireRelationship
      relationship: traceTo
      min: 1
    severity: warning

viewpoints:
  - id: risk-overview
    label: Risk Overview (ISO 14971)
    supportedDiagramTypes: [risk, req, pkg]
    visibleKinds:
      - Hazard
      - HazardousSituation
      - Harm
      - Risk
      - RiskControl
      - SafetyGoal
    visibleRelationships:
      - mitigates
      - causes
      - leadsTo
      - identifies
    visibleLayers:
      - risk
      - safety
    diagrams:
      - id: diag-risk-chain
        name: Risk Mitigation Chain
        diagramType: risk
        viewpointId: risk-overview
        auto: true
        description: Hazard to RiskControl to Test mitigation chain

  - id: safety-view
    label: Safety Analysis
    supportedDiagramTypes: [bdd, req, pkg]
    visibleKinds:
      - SafetyGoal
      - RiskControl
      - Hazard
      - SystemFunction
      - ComponentFunction
      - Test
    visibleRelationships:
      - mitigates
      - allocateTo
      - traceTo
      - verify
    visibleLayers:
      - risk
      - safety
      - functional
      - verification
    diagrams:
      - id: diag-safety-mitigation
        name: Safety Mitigation
        diagramType: bdd
        viewpointId: safety-view
        auto: true
        description: Safety goals linked to risk controls, functions, and verification tests

  - id: software-view
    label: Software Architecture
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - Software
      - SoftwareSystem
      - SoftwareItem
      - SoftwareUnit
      - SoftwareComponent
      - SoftwareModule
      - Firmware
      - Docker
      - OperatingSystem
      - RosNode
      - RosTopic
      - RosService
      - Interface
      - InterfaceContract
    visibleRelationships:
      - aggregation
      - composedOf
      - dependency
      - realization
    visibleLayers:
      - software
      - software-lifecycle
      - interfaces
    diagrams:
      - id: diag-sw-decomposition
        name: Software Decomposition
        diagramType: bdd
        viewpointId: software-view
        auto: true
        description: Software components and lifecycle decomposition

  - id: physical-view
    label: Physical Architecture
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - PhysicalComponent
      - ElectricalComponent
      - MechanicalComponent
      - HardwareNode
      - ComputingDevice
      - PhysicalModule
      - FPGA
      - Microcontroller
      - SingleBoardComputer
      - Catheter
    visibleRelationships:
      - aggregation
      - composedOf
      - association
    visibleLayers:
      - physical
    diagrams:
      - id: diag-phy-bom
        name: Physical BOM
        diagramType: bdd
        viewpointId: physical-view
        auto: true
        description: Physical components and hardware nodes
      - id: diag-phy-containment
        name: Physical Containment
        diagramType: ibd
        viewpointId: physical-view
        auto: true
        description: Physical system breakdown — nested containment view
        properties:
          layoutStyle: ibd

firstRun:
  template: infusion-pump
  promptForMetadata: true
  scaffoldFiles:
    - infusion-pump.sysml
