# @memo/medical — CoSMA-layered domain configuration (Comprehensive)
# Medical device MBSE domain: ISO 14971, IEC 62304, IEC 62366
# 60+ entity kinds across 9 layers, 16 relationship types, 15 closure rules
#
# This config is copied to .memo/config.yaml by `memo init medical <name>`.
# Projects inherit all layers, kinds, relationships, and closure rules.

projectName: "@memo/medical"
projectType: device

ontologies:
  - name: memo-ontology
    version: "^2.0.0"

extends: "@memo/ontology"

# ─── CoSMA Visualization Layers ───────────────────────────────────────────────

cosmaLayers:
  - id: business
    label: Business Analysis
    color: "#8E44AD"

  - id: requirements
    label: Requirements
    color: "#4A90D9"

  - id: risk
    label: Risk Management
    color: "#E74C3C"

  - id: functional
    label: Functional Analysis
    color: "#E67E22"

  - id: logical
    label: Logical Architecture
    color: "#7B68EE"

  - id: physical
    label: Physical Architecture
    color: "#95A5A6"

  - id: software
    label: Software Architecture
    color: "#F39C12"

  - id: interfaces
    label: Interfaces & Ports
    color: "#1ABC9C"

  - id: verification
    label: Verification
    color: "#2ECC71"

  - id: ui
    label: UI Wireframe
    color: "#3498DB"

# ─── Entity Kind Definitions ──────────────────────────────────────────────────
# Each kind maps to a SysML v2 construct and belongs to a CoSMA layer.

kinds:
  # ── Business Analysis ────────────────────────────────────────────────────
  Actor:
    label: Actor
    layer: business
    sysmlConstruct: part def

  Stakeholder:
    label: Stakeholder
    layer: business
    sysmlConstruct: part def

  Goal:
    label: Goal
    layer: business
    sysmlConstruct: part def

  Concern:
    label: Concern
    layer: business
    sysmlConstruct: part def

  Responsibility:
    label: Responsibility
    layer: business
    sysmlConstruct: part def

  Capability:
    label: Capability
    layer: business
    sysmlConstruct: part def

  # ── Requirements ─────────────────────────────────────────────────────────
  UserNeed:
    label: User Need
    layer: requirements
    sysmlConstruct: requirement def

  SystemRequirement:
    label: System Requirement
    layer: requirements
    sysmlConstruct: requirement def

  SoftwareRequirement:
    label: Software Requirement
    layer: requirements
    sysmlConstruct: requirement def

  HardwareRequirement:
    label: Hardware Requirement
    layer: requirements
    sysmlConstruct: requirement def

  DesignSpecification:
    label: Design Specification
    layer: requirements
    sysmlConstruct: requirement def

  OtherRequirement:
    label: Other Requirement
    layer: requirements
    sysmlConstruct: requirement def

  # ── Risk Management (ALL are requirement def) ───────────────────────────
  Hazard:
    label: Hazard
    layer: risk
    sysmlConstruct: requirement def

  HazardousSituation:
    label: Hazardous Situation
    layer: risk
    sysmlConstruct: requirement def

  Harm:
    label: Harm
    layer: risk
    sysmlConstruct: requirement def
    defaultAttributes:
      severity: "Serious"

  Risk:
    label: Risk
    layer: risk
    sysmlConstruct: requirement def
    defaultAttributes:
      riskAcceptance: "NeedsReview"

  RiskControl:
    label: Risk Control
    layer: risk
    sysmlConstruct: requirement def

  SafetyGoal:
    label: Safety Goal
    layer: risk
    sysmlConstruct: requirement def

  # ── Functional Analysis ──────────────────────────────────────────────────
  SystemFunction:
    label: System Function
    layer: functional
    sysmlConstruct: action def

  ComponentFunction:
    label: Component Function
    layer: functional
    sysmlConstruct: action def

  UserActivity:
    label: User Activity
    layer: functional
    sysmlConstruct: action def

  UIFunction:
    label: UI Function
    layer: functional
    sysmlConstruct: action def

  UseCase:
    label: Use Case
    layer: functional
    sysmlConstruct: part def

  Scenario:
    label: Scenario
    layer: functional
    sysmlConstruct: action def

  # ── Logical Architecture ─────────────────────────────────────────────────
  System:
    label: System
    layer: logical
    sysmlConstruct: part def

  SystemExternal:
    label: External System
    layer: logical
    sysmlConstruct: part def

  Subsystem:
    label: Subsystem
    layer: logical
    sysmlConstruct: part def

  Component:
    label: Component
    layer: logical
    sysmlConstruct: part def

  LogicalComponent:
    label: Logical Component
    layer: logical
    sysmlConstruct: part def

  LogicalComponentExternal:
    label: External Logical Component
    layer: logical
    sysmlConstruct: part def

  EnvironmentElement:
    label: Environment Element
    layer: logical
    sysmlConstruct: part def

  ArchitectureDecision:
    label: Architecture Decision
    layer: logical
    sysmlConstruct: part def

  ArchitectureRationale:
    label: Architecture Rationale
    layer: logical
    sysmlConstruct: part def

  QualityAttribute:
    label: Quality Attribute
    layer: logical
    sysmlConstruct: part def

  Question:
    label: Question
    layer: logical
    sysmlConstruct: part def

  # ── Physical Architecture ────────────────────────────────────────────────
  PhysicalComponent:
    label: Physical Component
    layer: physical
    sysmlConstruct: part def

  ElectricalComponent:
    label: Electrical Component
    layer: physical
    sysmlConstruct: part def

  MechanicalComponent:
    label: Mechanical Component
    layer: physical
    sysmlConstruct: part def

  Catheter:
    label: Catheter
    layer: physical
    sysmlConstruct: part def

  PhysicalModule:
    label: Physical Module
    layer: physical
    sysmlConstruct: part def

  HardwareNode:
    label: Hardware Node
    layer: physical
    sysmlConstruct: part def

  ComputingDevice:
    label: Computing Device
    layer: physical
    sysmlConstruct: part def

  FPGA:
    label: FPGA
    layer: physical
    sysmlConstruct: part def

  Microcontroller:
    label: Microcontroller
    layer: physical
    sysmlConstruct: part def

  SingleBoardComputer:
    label: Single Board Computer
    layer: physical
    sysmlConstruct: part def

  # ── Software Architecture ────────────────────────────────────────────────
  Software:
    label: Software
