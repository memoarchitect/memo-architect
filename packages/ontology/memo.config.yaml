# @memo/ontology — Transitional compatibility ontology configuration
# Preserves the legacy broad MEMO_Ontology surface while the clean backbone
# moves to @memo/ontology-core and @memo/ontology-medical.
#
# New work should prefer @memo/ontology-core and @memo/ontology-medical.
# This package remains to support existing MEMO_Ontology imports and older
# examples while the split is completed.

projectName: "@memo/ontology"
projectType: ontology
extends: "@memo/ontology-medical"

ontologyMetadata:
  id: "@memo/ontology"
  version: "2.0.0"
  description: "Transitional compatibility ontology layered on @memo/ontology-medical to preserve the legacy MEMO_Ontology package surface"
  author: "SysAnd"
  license: "Apache-2.0"
  tags:
    - mbse
    - sysml-v2
    - systems-engineering
    - compatibility

# ─── CoSMA Visualization Layers ───────────────────────────────────────────────

cosmaLayers:
  - id: business
    label: Business Analysis
    color: "#8E44AD"

  - id: operational
    label: Operational Analysis
    color: "#C0392B"

  - id: requirements
    label: Requirements
    color: "#4A90D9"

  - id: functional
    label: Functional Analysis
    color: "#E67E22"

  - id: logical
    label: Logical Architecture
    color: "#7B68EE"

  - id: physical
    label: Physical Architecture
    color: "#95A5A6"

  - id: software
    label: Software Architecture
    color: "#F39C12"

  - id: interfaces
    label: Interfaces & Ports
    color: "#1ABC9C"

  - id: analysis
    label: Analysis & Constraints
    color: "#16A085"

  - id: behavior
    label: Behavior
    color: "#FF6B6B"

  - id: verification
    label: Verification
    color: "#2ECC71"

