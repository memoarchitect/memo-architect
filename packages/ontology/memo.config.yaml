# ─── Viewpoints ───────────────────────────────────────────────────────────────
# Universal viewpoints for systems engineering.

viewpoints:
  # Context Viewpoint — system boundary, external actors/systems (ISO 42010 / Asensus)
  - id: context-view
    label: System Context
    supportedDiagramTypes: [bdd, pkg]
    visibleKinds:
      - System
      - SystemExternal
      - Actor
      - Stakeholder
      - EnvironmentElement
    visibleRelationships:
      - association
      - dependency
    visibleLayers:
      - logical
      - business
    diagrams:
      - id: diag-ctx-overview
        name: System Context
        diagramType: bdd
        viewpointId: context-view
        auto: true
        description: System boundary with external actors and interfacing systems

  - id: operational-view
    label: Operational Analysis
    supportedDiagramTypes: [bdd, act, pkg]
    visibleKinds:
      - Mission
      - OperationalActor
      - OperationalEntity
      - MissionPhase
      - OperationalActivity
      - OperationalScenario
    visibleRelationships:
      - association
      - succession
      - traceTo
    visibleLayers:
      - operational
      - business
    diagrams:
      - id: diag-operational-overview
        name: Operational Overview
        diagramType: act
        viewpointId: operational-view
        auto: true
        description: Mission phases, actors, and operational scenarios

  # Functional Viewpoint — what the system needs to do (functions, allocation)
  - id: functional-view
    label: Functional Analysis
    supportedDiagramTypes: [bdd, act, pkg]
    visibleKinds:
      - SystemFunction
      - ComponentFunction
      - System
      - Subsystem
      - Component
    visibleRelationships:
      - allocateTo
      - traceTo
      - composedOf
      - decomposedBy
    visibleLayers:
      - functional
      - logical
    diagrams:
      - id: diag-fbs-tree
        name: Functional Breakdown (FBS)
        diagramType: bdd
        viewpointId: functional-view
        auto: true
        description: Hierarchical function decomposition tree — parent functions broken into sub-functions
        properties:
          layoutStyle: fbs
      - id: diag-func-allocation
        name: Functional Allocation
        diagramType: bdd
        viewpointId: functional-view
        auto: true
        description: Functions allocated to logical components

  # Logical Viewpoint — how the system is decomposed (subsystems, components, interfaces)
  - id: logical-view
    label: Logical Architecture
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - System
      - Subsystem
      - Component
      - LogicalComponent
      - LogicalComponentExternal
    visibleRelationships:
      - aggregation
      - composedOf
      - association
    visibleLayers:
      - logical
    diagrams:
      - id: diag-logical-decomposition
        name: System Decomposition
        diagramType: bdd
        viewpointId: logical-view
        auto: true
        description: System broken down into subsystems and components
      - id: diag-logical-ibd
        name: Internal Block Diagram
        diagramType: ibd
        viewpointId: logical-view
        auto: true
        description: Internal structure — subsystem interconnections and interfaces
        properties:
          layoutStyle: ibd

  # Interface Viewpoint — ports, interfaces, data types
  - id: interface-view
    label: Interfaces & Ports
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - Port
      - PortEthernet
      - PortUSB
      - PortSerial
      - PortPower
      - Interface
      - SoftwareInterface
      - SoftwareProvidedInterface
      - SoftwareRequiredInterface
      - DataType
    visibleRelationships:
      - association
      - dependency
    visibleLayers:
      - interfaces
    diagrams:
      - id: diag-iface-overview
        name: Interface Overview
        diagramType: bdd
        viewpointId: interface-view
        auto: true
        description: System ports, interfaces, and data types

  - id: requirements-trace
    label: Requirements Traceability
    supportedDiagramTypes: [req, pkg]
    visibleKinds:
      - UserNeed
      - SystemRequirement
      - SoftwareRequirement
      - HardwareRequirement
      - DesignSpecification
    visibleRelationships:
      - traceTo
      - trace
      - satisfy
    visibleLayers:
      - requirements
    diagrams:
      - id: diag-req-traceability
        name: Traceability Chain
        diagramType: req
        viewpointId: requirements-trace
        auto: true
        description: UserNeed to SystemReq to SoftwareReq trace chain

  - id: use-case-view
    label: Use Case View
    supportedDiagramTypes: [ucd, act, pkg]
    visibleKinds:
      - Actor
      - UseCase
      - Scenario
      - UserActivity
      - UserNeed
    visibleRelationships:
      - association
      - traceTo
      - extend
      - include
    visibleLayers:
      - business
      - functional
    diagrams:
      - id: diag-uc-overview
        name: Use Case Overview
        diagramType: ucd
        viewpointId: use-case-view
        auto: true
        description: Actors and use cases with associations

  - id: v-and-v
    label: Verification & Validation
    supportedDiagramTypes: [req, par, pkg]
    visibleKinds:
      - Test
      - SystemRequirement
      - SoftwareRequirement
    visibleRelationships:
      - verify
      - satisfy
      - traceTo
    visibleLayers:
      - verification
      - requirements
    diagrams:
      - id: diag-vv-coverage
        name: Test Coverage
        diagramType: req
        viewpointId: v-and-v
        auto: true
        description: Requirements verified by tests

  - id: behavior-view
    label: Behavior View
    supportedDiagramTypes: [afd, act]
    visibleKinds:
      - ActionDefinition
      - ActionUsage
      - ItemDefinition
    visibleRelationships:
      - flow
      - succession
      - allocateTo
    visibleLayers:
      - behavior
    diagrams:
      - id: diag-behavior-flow
        name: Action Flow
        diagramType: afd
        viewpointId: behavior-view
        auto: true
        description: Action definitions with flows, successions, and allocations

closureRules: []
