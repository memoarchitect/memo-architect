# @memo/medical-modeling-profile — viewpoint definitions
# Medical device viewpoints for ISO 42010-aligned model views

viewpoints:
  - id: risk-overview
    label: Risk Overview (ISO 14971)
    supportedDiagramTypes: [risk, req, pkg]
    visibleKinds:
      - Hazard
      - HazardousSituation
      - Harm
      - Risk
      - RiskControl
      - ClinicalBenefit
      - BenefitRiskAssessment
      - ResidualRiskEvaluation
      - OverallResidualRiskEvaluation
      - DetectionControl
      - FailureModesAndEffectsAnalysis
      - FailureMode
      - FailureEffect
      - FaultTreeAnalysis
      - TopEvent
      - RiskManagementPlan
      - RiskManagementReport
      - ProductionPostProductionSignal
      - SafetyGoal
      - UseError
      - EssentialPerformance
      - SafetyFunction
      - Test
      - ComplianceEvidence
    visibleRelationships:
      - mitigates
      - causes
      - leadsTo
      - identifies
      - plansRiskManagement
      - assessesResidualRisk
      - weighsAgainstBenefit
      - concludesBenefitRisk
