# @memo/medical-modeling-profile — viewpoint definitions (v12 two-ontology aligned)
# All kinds reference @memo/ontology-arch or @memo/ontology-process namespaces.

viewpoints:
  - id: risk-overview
    label: Risk Overview (ISO 14971)
    supportedDiagramTypes: [risk, req, pkg]
    visibleKinds:
      - Hazard
      - HazardousSituation
      - Harm
      - Risk
      - Mitigation
      - FailureMode
      - FaultTreeNode
      - RiskManagementPlan
      - RiskManagementReport
      - ResidualRiskEvaluation
      - OverallResidualRiskEvaluation
      - BenefitRiskAssessment
      - PostMarketSurveillanceFeedback
      - VerificationCase
      - Evidence
    visibleRelationships:
      - mitigates
      - causes
      - leadsTo
      - identifiesRisk
      - plansRiskManagement
      - assessesResidualRisk
      - weighsAgainstBenefit
      - concludesBenefitRisk
      - concludesOverallResidualRisk
      - monitorsPostMarket
      - hasFailureMode
      - contributesTo
      - verifies
      - producesEvidence
    visibleLayers:
      - safety
      - verification
      - iso-14971
    diagrams:
      - id: diag-risk-chain
        name: Risk Mitigation Chain
        diagramType: risk
        viewpointId: risk-overview
        auto: true
        description: Hazard to Mitigation to VerificationCase chain (ISO 14971)

  - id: safety-view
    label: Safety Analysis
    supportedDiagramTypes: [bdd, req, pkg]
    visibleKinds:
      - Hazard
      - HazardousSituation
      - Harm
      - Risk
      - Mitigation
      - FailureMode
      - FaultTreeNode
      - Function
      - Requirement
      - VerificationCase
      - Evidence
      - EssentialPerformanceDefinition
      - BasicSafetyRequirement
    visibleRelationships:
      - mitigates
      - causes
      - leadsTo
      - identifiesRisk
      - hasFailureMode
      - contributesTo
      - allocatedTo
      - satisfies
      - verifies
      - producesEvidence
    visibleLayers:
      - safety
      - functional
      - verification
      - iec-60601
    diagrams:
      - id: diag-safety-mitigation
        name: Safety Mitigation
        diagramType: bdd
        viewpointId: safety-view
        auto: true
        description: Safety chain from Hazard through Mitigation to VerificationCase and Evidence

  - id: software-view
    label: Software Architecture (IEC 62304)
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - SoftwareComponent
      - SoftwareModule
      - SoftwareInterface
      - ExecutionThread
      - SoftwareItem
      - SoftwareUnit
      - SOUPItem
      - SoftwareDevelopmentPlan
      - SoftwareRequirementsSpec
      - SoftwareArchitectureDocument
      - SoftwareUnitTestRecord
      - SoftwareIntegrationTestRecord
      - SoftwareSystemTestRecord
      - SoftwareProblemReport
      - ChangeImpactAssessment
      - SOUPEvaluation
      - Requirement
      - VerificationCase
      - Evidence
    visibleRelationships:
      - composedOf
      - dependency
      - derives
      - satisfies
      - verifies
      - producesEvidence
      - deployedOn
      - governs
    visibleLayers:
      - software
      - iec-62304
      - verification
    diagrams:
      - id: diag-sw-decomposition
        name: Software Decomposition
        diagramType: bdd
        viewpointId: software-view
        auto: true
        description: Software components and IEC 62304 lifecycle artifacts

  - id: security-view
    label: Cybersecurity (IEC 81001-5-1)
    supportedDiagramTypes: [bdd, req, pkg]
    visibleKinds:
      - TrustBoundary
      - Asset
      - ThreatScenario
      - Control
      - SecurityRequirement
      - Interface
      - Port
      - LogicalComponent
      - SoftwareComponent
      - VerificationCase
      - Evidence
    visibleRelationships:
      - threatensAsset
      - exploitsVulnerability
      - mitigatesThreat
      - protectsAsset
      - crossesBoundary
      - exposesInterface
      - satisfies
      - verifies
      - producesEvidence
      - addressesSecurityReq
    visibleLayers:
      - security
      - logical
      - verification
    diagrams:
      - id: diag-cybersecurity-trace
        name: Cybersecurity Threat Trace
        diagramType: bdd
        viewpointId: security-view
        auto: true
        description: ThreatScenario → Asset → Control → SecurityRequirement chain

  - id: privacy-view
    label: Privacy Engineering (GDPR / ISO 27701)
    supportedDiagramTypes: [bdd, req, pkg]
    visibleKinds:
      - DataCategory
      - DataSubjectCategory
      - ProcessingActivity
      - RetentionRule
      - PrivacyRiskScenario
      - PrivacyRequirement
      - DataProtectionImpactAssessment
      - PrivacyNotice
      - DataBreachRecord
      - Evidence
    visibleRelationships:
      - classifiesData
      - processesData
      - affectsDataSubject
      - governedByRetention
      - assessesPrivacyImpact
      - addressesPrivacyReq
      - producesEvidence
    visibleLayers:
      - privacy
      - verification
      - iso-27001-27701
    diagrams:
      - id: diag-privacy-governance
        name: Privacy Governance
        diagramType: bdd
        viewpointId: privacy-view
        auto: true
        description: DataCategory → ProcessingActivity → RetentionRule and DPIA chain

  - id: clinical-evidence-view
    label: Clinical Evidence & Claims (ISO 14155)
    supportedDiagramTypes: [req, pkg, bdd]
    visibleKinds:
      - IntendedUse
      - ClinicalPerformanceClaim
      - ClinicalSafetyClaim
      - ClinicalEvaluationPlan
      - ClinicalEvaluationReport
      - ClinicalInvestigationPlan
      - ClinicalInvestigationReport
      - BenefitRiskAssessment
      - OverallResidualRiskEvaluation
      - RiskManagementReport
      - Evidence
      - PostMarketSurveillanceFeedback
    visibleRelationships:
      - claimsForUse
      - supportsClinicalClaim
      - plansClinicalEvaluation
      - evaluatesClinicalClaim
      - weighsAgainstBenefit
      - concludesBenefitRisk
      - concludesOverallResidualRisk
      - monitorsPostMarket
      - producesEvidence
    visibleLayers:
      - verification
      - iso-14155
      - iso-14971
    diagrams:
      - id: diag-clinical-evidence
        name: Clinical Evidence And Claims
        diagramType: req
        viewpointId: clinical-evidence-view
        auto: true
        description: Clinical claims linked to intended use, evidence, and governed evaluation

  - id: hardware-view
    label: Hardware Architecture
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - HardwareComponent
      - HardwareAssembly
      - HardwareBoard
      - HardwarePart
      - Processor
      - LogicalComponent
      - SoftwareComponent
      - ExecutionThread
    visibleRelationships:
      - composedOf
      - aggregation
      - deployedOn
      - allocatedTo
    visibleLayers:
      - hardware
      - logical
      - software
    diagrams:
      - id: diag-hw-bom
        name: Hardware BOM
        diagramType: bdd
        viewpointId: hardware-view
        auto: true
        description: Hardware component breakdown and software deployment allocation

  - id: ros-view
    label: ROS Topology
    supportedDiagramTypes: [bdd, ibd, pkg]
    visibleKinds:
      - ROSNode
      - ROSTopic
      - ROSMessageType
      - ROSService
      - ROSAction
      - SoftwareComponent
      - Interface
    visibleRelationships:
      - composedOf
      - flow
      - exposesInterface
      - connectsVia
    visibleLayers:
      - software-extension
      - software
    diagrams:
      - id: diag-ros-topology
        name: ROS Node Topology
        diagramType: bdd
        viewpointId: ros-view
        auto: true
        description: ROS nodes, topics, services, and message types

  - id: qms-dhf-view
    label: Design History File (ISO 13485 / FDA 21 CFR 820)
    supportedDiagramTypes: [req, pkg]
    visibleKinds:
      - DesignAndDevelopmentPlan
      - DesignInput
      - DesignOutput
      - DesignVerification
      - DesignValidation
      - DesignTransfer
      - DesignChange
      - DesignHistoryFile
      - DHFArtifact
      - DeviceMasterRecord
      - DeviceHistoryRecord
      - QMSRecord
      - CAPARecord
      - Requirement
      - Evidence
    visibleRelationships:
      - tracesDesignInput
      - verifiesOutput
      - validatesOutput
      - documentsChange
      - containsArtifact
      - instantiatesDMR
      - satisfies
      - producesEvidence
    visibleLayers:
      - iso-13485
      - fda-21cfr820
      - verification
    diagrams:
      - id: diag-dhf
        name: Design History File
        diagramType: req
        viewpointId: qms-dhf-view
        auto: true
        description: ISO 13485 design control and FDA 21 CFR 820 DHF artifacts

firstRun:
  template: infusion-pump
  promptForMetadata: true
  scaffoldFiles:
    - infusion-pump.sysml
