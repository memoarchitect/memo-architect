      - escalatesToRisk
      - detectsFailureMode
      - definesTopEvent
      - contributesToEvent
      - triggersHazardousSituation
      - contributesToHazard
      - implementsRiskControl
      - protectsEssentialPerformance
      - verify
      - evidences
    visibleLayers:
      - risk
      - safety
      - verification
    diagrams:
