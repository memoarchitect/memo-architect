# @memo/medical-modeling-profile — Medical modeling profile package
# Extends @memo/ontology-medical with:
#   - closure rules
#   - medical viewpoints
#   - starter scaffolding
#   - closure rules, viewpoints, and starter scaffolding only

projectName: "@memo/medical-modeling-profile"
projectType: profile

ontologies:
  - name: memo-ontology-medical
    version: "^0.1.0"

extends: "@memo/ontology-medical"

ontologyMetadata:
  id: "@memo/medical-modeling-profile"
  version: "2.0.0"
  description: "Medical modeling profile package — closure rules, viewpoints, and starter templates on top of @memo/ontology-medical"
  author: "SysAnd"
  license: "Apache-2.0"
  tags:
    - medical-device
    - ISO-14971
    - IEC-62304
    - IEC-60601
    - modeling-profile

closureRules:
  - id: CR-MED-001
    description: "Every Hazard must have at least one mitigates relationship (ISO 14971 §6)"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: mitigates
      direction: incoming
      relatedKinds: [RiskControl]
      min: 1
    severity: error

  - id: CR-MED-002
    description: "Every Hazard must cause at least one HazardousSituation"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: causes
      direction: outgoing
      relatedKinds: [HazardousSituation]
      min: 1
    severity: error

  - id: CR-MED-003
    description: "Every RiskControl must be verified by at least one Test"
    entity: RiskControl
    rule:
      type: requireRelationship
      relationship: verify
      direction: incoming
      relatedKinds: [Test]
      min: 1
    severity: error

  - id: CR-MED-004
    description: "Every Risk must identify at least one Hazard"
    entity: Risk
    rule:
      type: requireRelationship
      relationship: identifies
      direction: outgoing
      relatedKinds: [Hazard]
      min: 1
    severity: error

  - id: CR-MED-005
    description: "Every HazardousSituation must be caused by a Hazard"
    entity: HazardousSituation
    rule:
      type: requireRelationship
      relationship: causes
      direction: incoming
      relatedKinds: [Hazard]
      min: 1
    severity: error

  - id: CR-MED-006
    description: "Every Harm must be led to by a HazardousSituation"
    entity: Harm
    rule:
      type: requireRelationship
      relationship: leadsTo
      direction: incoming
      relatedKinds: [HazardousSituation]
      min: 1
    severity: warning

  - id: CR-MED-007
    description: "Every SoftwareRequirement must derive from a SystemRequirement"
    entity: SoftwareRequirement
    rule:
      type: requireRelationship
      relationship: derives
      direction: incoming
      relatedKinds: [SystemRequirement]
      min: 1
    severity: error

  - id: CR-MED-008
    description: "Every SystemRequirement should derive from a UserNeed"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: derives
      direction: incoming
      relatedKinds: [UserNeed]
      min: 1
    severity: warning

  - id: CR-MED-009
    description: "Every SystemRequirement should be satisfied by a LogicalComponent"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: satisfy
      direction: incoming
      relatedKinds:
        - LogicalComponent
        - Subsystem
        - Component
        - SoftwareComponent
        - SoftwareItem
      min: 1
    severity: warning

  - id: CR-MED-010
    description: "Every SystemFunction must be allocated to a LogicalComponent or Software"
    entity: SystemFunction
    rule:
      type: requireRelationship
      relationship: allocateTo
      direction: outgoing
      relatedKinds:
        - LogicalComponent
        - Subsystem
        - Software
        - SoftwareComponent
        - SoftwareItem
      min: 1
    severity: error

  - id: CR-MED-011
    description: "Every Software must have a safetyClassification attribute"
    entity: Software
    rule:
      type: requireAttribute
      attribute: safetyClassification
    severity: error

  - id: CR-MED-012
    description: "Every UseCase should be refined by at least one Scenario"
    entity: UseCase
    rule:
      type: requireRelationship
      relationship: refines
      direction: outgoing
      relatedKinds: [Scenario]
      min: 1
    severity: warning

  - id: CR-MED-013
    description: "Every SystemRequirement must be verified by at least one Test"
    entity: SystemRequirement
    rule:
      type: requireRelationship
      relationship: verify
      direction: incoming
      relatedKinds: [Test]
      min: 1
    severity: warning

  - id: CR-MED-014
    description: "Every SoftwareRequirement must be verified by at least one Test"
