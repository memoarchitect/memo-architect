closureRules:
  # ─── Safety (ISO 14971) ────────────────────────────────────────────────────

  - id: CR-MED-001
    description: "Every Hazard must have at least one mitigates relationship (ISO 14971 §6)"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: mitigates
      direction: incoming
      relatedKinds: [Mitigation]
      min: 1
    severity: error

  - id: CR-MED-002
    description: "Every Hazard must cause at least one HazardousSituation"
    entity: Hazard
    rule:
      type: requireRelationship
      relationship: causes
      direction: outgoing
      relatedKinds: [HazardousSituation]
      min: 1
    severity: error

  - id: CR-MED-004
    description: "Every Risk must identify at least one Hazard"
    entity: Risk
    rule:
      type: requireRelationship
      relationship: identifiesRisk
      direction: outgoing
      relatedKinds: [Hazard]
      min: 1
    severity: error

  - id: CR-MED-005
    description: "Every HazardousSituation must be caused by a Hazard"
    entity: HazardousSituation
    rule:
      type: requireRelationship
      relationship: causes
      direction: incoming
      relatedKinds: [Hazard]
      min: 1
    severity: error

  - id: CR-MED-006
    description: "Every Harm must be led to by a HazardousSituation"
    entity: Harm
    rule:
      type: requireRelationship
      relationship: leadsTo
      direction: incoming
      relatedKinds: [HazardousSituation]
      min: 1
    severity: warning

  - id: CR-MED-040
    description: "Every FailureMode must trace to at least one Risk"
    entity: FailureMode
    rule:
      type: requireRelationship
      relationship: identifiesRisk
      direction: outgoing
      relatedKinds: [Risk]
      min: 1
    severity: warning

  - id: CR-MED-041
    description: "Every FailureMode must link to at least one FaultTreeNode or Hazard"
    entity: FailureMode
    rule:
      type: requireRelationship
      relationship: contributesTo
      direction: outgoing
      relatedKinds: [FaultTreeNode, Hazard]
      min: 1
    severity: warning

  - id: CR-MED-056
    description: "Every RiskManagementPlan should plan at least one risk subject (ISO 14971 §4.4)"
    entity: RiskManagementPlan
    rule:
      type: requireRelationship
      relationship: plansRiskManagement
      direction: outgoing
      relatedKinds:
        - Risk
        - FailureMode
        - ResidualRiskEvaluation
        - BenefitRiskAssessment
      min: 1
    severity: warning

  - id: CR-MED-057
    description: "Every ResidualRiskEvaluation should assess at least one Risk or Harm"
    entity: ResidualRiskEvaluation
    rule:
      type: requireRelationship
      relationship: assessesResidualRisk
      direction: outgoing
      relatedKinds: [Risk, HazardousSituation, Harm]
      min: 1
    severity: warning

  - id: CR-MED-058
    description: "Every BenefitRiskAssessment should weigh at least one benefit"
    entity: BenefitRiskAssessment
    rule:
      type: requireRelationship
      relationship: weighsAgainstBenefit
      direction: outgoing
      min: 1
    severity: warning

  - id: CR-MED-060
    description: "Every RiskManagementReport should conclude an OverallResidualRiskEvaluation"
    entity: RiskManagementReport
    rule:
      type: requireRelationship
      relationship: concludesOverallResidualRisk
      direction: outgoing
      relatedKinds: [OverallResidualRiskEvaluation]
      min: 1
    severity: warning

  - id: CR-MED-061
    description: "Every PostMarketSurveillanceFeedback should monitor at least one risk subject"
    entity: PostMarketSurveillanceFeedback
    rule:
      type: requireRelationship
      relationship: monitorsPostMarket
      direction: outgoing
      relatedKinds: [Risk, Hazard, Harm, Mitigation]
      min: 1
    severity: warning

  # ─── Requirements & Verification ──────────────────────────────────────────

  - id: CR-MED-007
    description: "Every software-scoped Requirement must derive from another Requirement"
    entity: Requirement
    rule:
      type: conditionalRequireRelationship
      condition:
        attribute: source
        operator: eq
        values: [Software]
      relationship: derives
      direction: incoming
      relatedKinds: [Requirement]
      min: 1
    severity: error

  - id: CR-MED-008
    description: "Every system-category Requirement should derive from another Requirement"
    entity: Requirement
    rule:
      type: conditionalRequireRelationship
      condition:
        attribute: source
        operator: eq
        values: [System]
      relationship: derives
      direction: incoming
      relatedKinds: [Requirement]
      min: 1
    severity: warning

  - id: CR-MED-009
    description: "Every system-category Requirement should be satisfied by a LogicalComponent or SoftwareComponent"
    entity: Requirement
    rule:
      type: conditionalRequireRelationship
      condition:
        attribute: source
        operator: eq
        values: [System]
      relationship: satisfies
      direction: incoming
      relatedKinds:
        - LogicalComponent
        - SoftwareComponent
        - SoftwareItem
      min: 1
    severity: warning

  - id: CR-MED-013
    description: "Every system-category Requirement should be verified by a VerificationCase"
    entity: Requirement
    rule:
      type: conditionalRequireRelationship
      condition:
        attribute: source
        operator: eq
        values: [System]
      relationship: verifies
      direction: incoming
      relatedKinds: [VerificationCase]
      min: 1
    severity: warning

  - id: CR-MED-014
    description: "Every software-scoped Requirement should be verified by a VerificationCase"
    entity: Requirement
    rule:
      type: conditionalRequireRelationship
      condition:
        attribute: source
        operator: eq
        values: [Software]
      relationship: verifies
      direction: incoming
      relatedKinds: [VerificationCase]
      min: 1
    severity: warning

  - id: CR-MED-015
    description: "Every VerificationCase must produce at least one Evidence"
    entity: VerificationCase
    rule:
      type: requireRelationship
      relationship: producesEvidence
      direction: outgoing
      relatedKinds: [Evidence]
      min: 1
    severity: error

  - id: CR-MED-062
    description: "Every security-category Requirement should be satisfied by a SoftwareComponent or Control"
    entity: Requirement
    rule:
      type: conditionalRequireRelationship
      condition:
        attribute: source
        operator: eq
        values: [Security]
      relationship: satisfies
      direction: incoming
      relatedKinds:
        - SoftwareComponent
        - LogicalComponent
        - Control
      min: 1
    severity: warning

  # ─── Functions & Allocation ────────────────────────────────────────────────

  - id: CR-MED-010
    description: "Every Function must be allocated to a LogicalComponent or SoftwareComponent"
    entity: Function
    rule:
      type: requireRelationship
      relationship: allocatedTo
      direction: outgoing
      relatedKinds:
        - LogicalComponent
        - SoftwareComponent
        - SoftwareModule
        - SoftwareItem
      min: 1
    severity: warning

  # ─── Software (IEC 62304) ─────────────────────────────────────────────────

  - id: CR-MED-011
    description: "Every SoftwareComponent must have a safetyClass set"
    entity: SoftwareComponent
    rule:
      type: requireAttribute
      attribute: safetyClass
    severity: error

  - id: CR-MED-019
    description: "Every SoftwareItem must declare a safetyClass"
    entity: SoftwareItem
    rule:
      type: requireAttribute
      attribute: safetyClass
    severity: error

  - id: CR-MED-020
    description: "Every SOUPItem should be documented by at least one Evidence"
    entity: SOUPItem
    rule:
      type: requireRelationship
      relationship: producesEvidence
      direction: incoming
      relatedKinds: [Evidence, DHFArtifact]
      min: 1
    severity: warning

  # ─── Security ────────────────────────────────────────────────────────────

  - id: CR-MED-064
    description: "Every ThreatScenario should threaten at least one Asset"
    entity: ThreatScenario
    rule:
      type: requireRelationship
      relationship: threatensAsset
      direction: outgoing
      relatedKinds: [Asset]
      min: 1
    severity: warning

  - id: CR-MED-066
    description: "Every Control should mitigate at least one ThreatScenario"
    entity: Control
    rule:
      type: requireRelationship
      relationship: mitigatesThreat
      direction: outgoing
      relatedKinds: [ThreatScenario]
      min: 1
    severity: warning

  # ─── Privacy ─────────────────────────────────────────────────────────────

  - id: CR-MED-098
    description: "Every ProcessingActivity should process at least one DataCategory"
    entity: ProcessingActivity
    rule:
      type: requireRelationship
      relationship: processesData
      direction: outgoing
      relatedKinds: [DataCategory]
      min: 1
    severity: warning

  - id: CR-MED-099
    description: "Every ProcessingActivity must declare a legalBasis attribute"
    entity: ProcessingActivity
    rule:
      type: requireAttribute
      attribute: legalBasis
    severity: error

  - id: CR-MED-101
    description: "Every DataCategory should govern at least one RetentionRule"
    entity: DataCategory
    rule:
      type: requireRelationship
      relationship: governs
      direction: incoming
      relatedKinds: [RetentionRule]
      min: 1
    severity: warning

  # ─── ROS (software-extension) ────────────────────────────────────────────

  - id: CR-MED-090
    description: "Every ROSTopic should carry at least one ROSMessageType"
    entity: ROSTopic
    rule:
      type: requireRelationship
      relationship: flow
      direction: outgoing
      relatedKinds: [ROSMessageType]
      min: 1
    severity: warning

  - id: CR-MED-094
    description: "Every ROSService should carry a request ROSMessageType"
    entity: ROSService
    rule:
      type: requireAttribute
      attribute: requestType
    severity: warning

  - id: CR-MED-095
    description: "Every ROSService should carry a response ROSMessageType"
    entity: ROSService
    rule:
      type: requireAttribute
      attribute: responseType
    severity: warning

  # ─── Clinical Evidence (ISO 14155) ────────────────────────────────────────

  - id: CR-MED-075
    description: "Every ClinicalPerformanceClaim should reference at least one IntendedUse"
    entity: ClinicalPerformanceClaim
    rule:
      type: requireRelationship
      relationship: claimsForUse
      direction: outgoing
      relatedKinds: [IntendedUse]
      min: 1
    severity: warning

  - id: CR-MED-076
    description: "Every ClinicalPerformanceClaim should be supported by at least one ClinicalInvestigationReport"
    entity: ClinicalPerformanceClaim
    rule:
      type: requireRelationship
      relationship: supportsClinicalClaim
      direction: incoming
      relatedKinds: [ClinicalInvestigationReport]
      min: 1
    severity: warning

  - id: CR-MED-078
    description: "Every ClinicalSafetyClaim should be evaluated by at least one ClinicalEvaluationReport"
    entity: ClinicalSafetyClaim
    rule:
      type: requireRelationship
      relationship: evaluatesClinicalClaim
      direction: incoming
      relatedKinds: [ClinicalEvaluationReport]
      min: 1
    severity: warning

  - id: CR-MED-079
    description: "Every ClinicalEvaluationPlan should plan at least one clinical claim"
    entity: ClinicalEvaluationPlan
    rule:
      type: requireRelationship
      relationship: plansClinicalEvaluation
      direction: outgoing
      relatedKinds: [ClinicalPerformanceClaim, ClinicalSafetyClaim]
      min: 1
    severity: warning
