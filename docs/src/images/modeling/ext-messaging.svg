<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Messaging extension — technology-neutral publish/subscribe"><defs></defs><rect x="0.5" y="0.5" width="999" height="359" rx="14" fill="#ffffff" stroke="#d9e2ec"/><text x="24" y="30" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1E2D">Messaging extension — technology-neutral publish/subscribe</text><text x="24" y="50" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">Delivery semantics live on the endpoint ports; a broker is a software component</text><rect x="40.0" y="130.0" width="220.0" height="110.0" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="150.0" y="145.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6d28d9" text-anchor="middle" dominant-baseline="central" font-style="italic">«SoftwareComponent»</text><text x="150.0" y="162.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" dominant-baseline="central">alarmService</text><rect x="390.0" y="120.0" width="220.0" height="130.0" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="500.0" y="135.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6d28d9" text-anchor="middle" dominant-baseline="central" font-style="italic">«MessagingBroker»</text><text x="500.0" y="152.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" dominant-baseline="central">mqttBroker</text><line x1="390.0" y1="164.0" x2="610.0" y2="164.0" stroke="#6d28d9" stroke-width="1"/><text x="400.0" y="178.0" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start" dominant-baseline="central">brokerProduct = Mosquitto</text><text x="400.0" y="195.0" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="start" dominant-baseline="central">persistenceEnabled = true</text><rect x="740.0" y="130.0" width="220.0" height="110.0" rx="7" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="850.0" y="145.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6d28d9" text-anchor="middle" dominant-baseline="central" font-style="italic">«SoftwareComponent»</text><text x="850.0" y="162.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" dominant-baseline="central">nurseStation</text><rect x="253.0" y="194.5" width="14" height="14" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/><path d="M263.9,201.5 L256.1,205.4 L256.1,197.6 z" fill="#6d28d9"/><text x="249.0" y="201.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52606d" text-anchor="end" dominant-baseline="central">MessagingPublisher</text><rect x="733.0" y="194.5" width="14" height="14" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/><path d="M743.9,201.5 L736.1,205.4 L736.1,197.6 z" fill="#6d28d9"/><text x="751.0" y="201.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52606d" text-anchor="start" dominant-baseline="central">MessagingSubscriber</text><rect x="383.0" y="197.5" width="14" height="14" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/><path d="M393.9,204.5 L386.1,208.4 L386.1,200.6 z" fill="#6d28d9"/><rect x="603.0" y="197.5" width="14" height="14" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/><path d="M613.9,204.5 L606.1,208.4 L606.1,200.6 z" fill="#6d28d9"/><path d="M267.0,201.5 L383.0,204.5" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round"/><path d="M617.0,204.5 L733.0,201.5" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round"/><path d="M331.5,201.5 L318.5,208.0 L318.5,195.0 z" fill="#6d28d9"/><rect x="303.6" y="175.0" width="42.8" height="19.0" rx="9.5" fill="#f5f3ff" stroke="#6d28d9" stroke-width="0.9" opacity="0.98"/><text x="325.0" y="184.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6d28d9" text-anchor="middle" dominant-baseline="central">alarm</text><path d="M681.5,201.5 L668.5,208.0 L668.5,195.0 z" fill="#6d28d9"/><rect x="653.6" y="175.0" width="42.8" height="19.0" rx="9.5" fill="#f5f3ff" stroke="#6d28d9" stroke-width="0.9" opacity="0.98"/><text x="675.0" y="184.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6d28d9" text-anchor="middle" dominant-baseline="central">alarm</text><rect x="40.0" y="280.2" width="196.3" height="19.5" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/><text x="138.1" y="290.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="middle" dominant-baseline="central">deliverySemantics = atLeastOnce</text><rect x="40.0" y="310.2" width="131.6" height="19.5" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/><text x="105.8" y="320.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="middle" dominant-baseline="central">publishRateHz = 1 Hz</text><rect x="740.0" y="280.2" width="196.3" height="19.5" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/><text x="838.1" y="290.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="middle" dominant-baseline="central">deliverySemantics = atLeastOnce</text><rect x="740.0" y="310.2" width="202.2" height="19.5" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1"/><text x="841.1" y="320.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="middle" dominant-baseline="central">lossBehaviour = escalate locally</text><text x="500.0" y="292.8" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle" dominant-baseline="central" font-style="italic">MessagingTopicInterface connects a publisher</text><text x="500.0" y="307.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52606d" text-anchor="middle" dominant-baseline="central" font-style="italic">port to a subscriber port and carries the flow</text><circle cx="267.0" cy="227.5" r="11" fill="#0B1E2D" stroke="#ffffff" stroke-width="2"/><text x="267.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text><circle cx="325.0" cy="159.5" r="11" fill="#0B1E2D" stroke="#ffffff" stroke-width="2"/><text x="325.