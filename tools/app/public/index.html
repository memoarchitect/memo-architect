<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEMO Trace Organizer</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>MEMO Trace Organizer</h1>
      <p>Edit and link needs, requirements, features, and tests</p>
    </div>
    <div class="topbar-actions">
      <button id="refreshBtn" class="btn secondary">Refresh</button>
      <button id="newBtn" class="btn">New Element</button>
    </div>
  </header>

  <main class="layout">
    <aside class="tree-pane">
      <div class="pane-title">Elements</div>
      <input id="filterInput" class="search" placeholder="Filter by id/title..." />
      <div id="tree" class="tree"></div>
    </aside>

    <section class="details-pane">
      <div class="pane-title">Element Editor</div>
      <form id="editorForm" class="editor" autocomplete="off">
        <div class="grid-2">
          <label>
            <span>ID</span>
            <input id="idInput" required pattern="[A-Za-z0-9_-]+" />
          </label>
          <label>
            <span>Type</span>
            <select id="typeInput">
              <option value="user_need">User Need</option>
              <option value="software_requirement">Software Requirement</option>
              <option value="feature">Feature</option>
              <option value="verification_test">Verification Test</option>
              <option value="other">Other</option>
            </select>
          </label>
        </div>

        <div class="grid-2">
          <label>
            <span>Domain</span>
            <input id="domainInput" maxlength="8" />
          </label>
          <label>
            <span>Status</span>
            <select id="statusInput">
              <option value="active">Active</option>
              <option value="draft">Draft</option>
              <option value="gap">Gap</option>
              <option value="deprecated">Deprecated</option>
            </select>
          </label>
        </div>

        <label>
          <span>Title</span>
          <input id="titleInput" />
        </label>

        <label>
          <span>Description</span>
          <textarea id="descriptionInput" rows="8"></textarea>
        </label>

        <label>
          <span>Tags (comma-separated)</span>
          <input id="tagsInput" placeholder="e.g. ears, priority:high" />
        </label>

        <section class="links-section">
          <div class="links-header">
            <h3>Links</h3>
            <div class="inline-controls">
              <select id="linkTargetSelect"></select>
              <button type="button" id="addLinkBtn" class="btn secondary">Add Link</button>
            </div>
          </div>
          <div id="linksList" class="chip-list"></div>
        </section>

        <div class="form-actions">
          <button type="submit" class="btn">Save</button>
          <button type="button" id="deleteBtn" class="btn danger">Delete</button>
          <span id="saveStatus" class="status"></span>
        </div>
      </form>
    </section>

    <aside class="graph-pane">
      <div class="pane-title">Link Neighborhood</div>
      <div id="linkGraph" class="link-graph"></div>
      <div class="legend">
        <div><span class="dot incoming"></span> Incoming links</div>
        <div><span class="dot selected"></span> Selected</div>
        <div><span class="dot outgoing"></span> Outgoing links</div>
      </div>
    </aside>
  </main>

  <template id="newModalTemplate">
    <div class="modal-overlay" role="dialog" aria-modal="true">
      <div class="modal-card">
        <h3>Create Element</h3>
        <label>
          <span>Element ID</span>
          <input id="newIdInput" placeholder="SR-NEW-001" />
        </label>
        <label>
          <span>Type</span>
          <select id="newTypeInput">
            <option value="user_need">User Need</option>
            <option value="software_requirement">Software Requirement</option>
            <option value="feature">Feature</option>
            <option value="verification_test">Verification Test</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label>
          <span>Domain</span>
          <input id="newDomainInput" placeholder="CFG" />
        </label>
        <div class="modal-actions">
          <button id="createConfirmBtn" class="btn">Create</button>
          <button id="createCancelBtn" class="btn secondary">Cancel</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
