site_name: MEMO — Medical Engineering Modelling Ontology
site_description: SysML v2 platform for medical device architecture, analysis, and documentation
site_author: Somesh Kashyap
repo_url: https://gitlab.com/somesh_sandbox/memo
repo_name: somesh_sandbox/memo

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/gitlab

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

docs_dir: docs/src
site_dir: docs/dist

plugins:
  - search

nav:
  - Home: index.md
  - Users:
      - Installation: users/installation.md
      - Running MEMO: users/running.md
      - Command Line Usage: users/cli-usage.md
      - Workbench UI Usage: users/ui-usage.md
      - Workbench Features:
          - DHF Workbench: users/dhf-workbench.md
          - Analysis Tools: users/analysis-tools.md
          - Intelligence & AI: users/ai-features.md
      - Guides:
          - Overview: users/guides-index.md
          - Starting a New Project: users/new-project.md
          - Modeling Your Device: users/modeling-guide.md
          - Importing Existing Data: users/importing-data.md
          - Validation & Closure Rules: users/validation.md
          - Viewpoints & Diagrams: users/viewpoints-diagrams.md
      - Tutorials:
          - Medical Device Quick Start: users/medical-device-tutorial.md
  - Developers:
      - Codebase Overview: developers/codebase-overview.md
      - Ontology:
          - Reference: developers/ontology/reference.md
          - Design & Type System: developers/design/ontology.md
          - CoSMA Layers: developers/design/cosma-layers.md
      - Architecture:
          - Overview: developers/architecture/overview.md
          - Monorepo Structure: developers/architecture/monorepo.md
          - Data Flow: developers/architecture/data-flow.md
          - WebSocket Protocol: developers/architecture/websocket-protocol.md
          - Platform Strategy: developers/architecture/platform-strategy.md
          - Rearchitecture Prompt: developers/architecture/rearchitect-prompt.md
      - Design:
          - Viewpoints: developers/design/viewpoints.md
          - Closure Rules & Validation: developers/design/closure-rules.md
          - Configuration System: developers/design/configuration.md
      - Configuration:
          - memo.config.yaml Reference: developers/config/reference.md
          - Medical Domain: developers/config/medical-domain.md
      - Roadmap: developers/development/roadmap.md
      - Plugin Development: developers/plugin-development.md
      - ADR:
          - ADR-1-1 Entity Type Mapping: developers/adr/ADR-1-1-entity-type-mapping.md
          - ADR-1-2 Relationship Representation: developers/adr/ADR-1-2-relationship-representation.md
          - ADR-1-3 Ontology Package Structure: developers/adr/ADR-1-3-ontology-package-structure.md
          - ADR-1-4 Closure Rule Representation: developers/adr/ADR-1-4-closure-rule-representation.md
          - ADR-1-5 Domain Config Extension: developers/adr/ADR-1-5-domain-config-extension.md
          - ADR-1-6 Ontology Split: developers/adr/ADR-1-6-ontology-core-medical-split.md
          - ADR-1-7 Legacy Compatibility: developers/adr/ADR-1-7-legacy-ontology-compatibility-policy.md
      - Contributing: developers/development/contributing.md


