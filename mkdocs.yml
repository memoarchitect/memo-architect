site_name: MEMO Architect
site_description: Interactive and distributable workbench for MEMO SysML v2 projects
site_author: Somesh Kashyap
site_url: https://memoarchitect.com/memo-architect/
repo_url: https://github.com/memoarchitect/memo-architect
repo_name: memoarchitect/memo-architect

theme:
  name: material
  font:
    text: Nunito
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Use dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use light mode
  logo: images/logo-brain.svg
  favicon: images/favicon.svg
  features:
    # navigation.sections is deliberately absent: it renders second-level
    # groups as flat bold headers. Without it the groups collapse and expand,
    # which is what lets Learn the Model, Use the Workbench, and Practical
    # Guides nest. Matches the memo ontology docs.
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/image-zoom.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # SysML v2 has no Pygments lexer. sysml_highlight.py supplies a small
        # dependency-free formatter, shared with the memo ontology docs.
        - name: sysml
          class: sysml
          format: !!python/name:sysml_highlight.sysml_fence_format
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2

docs_dir: docs/src
site_dir: docs/dist

plugins:
  - search

nav:
  - Start Here:
      # A bare index.md is the section landing page under navigation.indexes,
      # the same shape the memo ontology docs use for Home.
      - index.md
      - Choose the Right MEMO Product: users/choose-layer.md
      - Prerequisites: users/prerequisites.md
      - Installation: users/installation.md
      - Running a Project: users/running.md
      - First Workbench Session: users/first-session.md
  - Use Architect:
      - Feature Tour: users/features.md
      - Learn the Model:
          - Layers and Their Questions: users/layers.md
          - Choosing Elements: users/elements.md
          - Connecting Elements: users/relationships.md
          - Worked GPCA Example: users/gpca-example.md
      - Use the Workbench:
          - Workbench UI: users/ui-usage.md
          - Viewpoints and Diagrams: users/viewpoints-diagrams.md
          - Validation and Closure: users/validation.md
          - Analysis Tools: users/analysis-tools.md
          - DHF Workbench: users/dhf-workbench.md
          - Intelligence and AI: users/ai-features.md
          - AI Coding Tools (MCP): users/mcp-cursor.md
      - Practical Guides:
          - Guide Map: users/guides-index.md
          - Start a New Project: users/new-project.md
          - Model Your Device: users/modeling-guide.md
          - Import Existing Data: users/importing-data.md
          - End-to-End Tutorial: users/medical-device-tutorial.md
          - Command Line Usage: users/cli-usage.md
  - Concepts and Design:
      - How Architect Works: concepts/architect.md
      - Codebase Overview: developers/codebase-overview.md
      - Modeling Configuration: developers/config/medical-domain.md
      - Viewpoint Configuration: developers/config/reference.md
  - Contribute:
      - Contributing: developers/development/contributing.md
      - Extend with a Plugin: developers/plugin-development.md
      - SysIDE Configuration: developers/syside-configuration.md
  - MEMO Family:
      - Product website: https://memoarchitect.com/
      - Ontology documentation: https://memoarchitect.com/memo/
      - Tools documentation: https://memoarchitect.com/memo-tools/
      - Architect documentation: https://memoarchitect.com/memo-architect/
