# Infusion Pump Project — example device model
projectName: infusion-pump
projectType: device

extends: "@memo/medical-modeling-profile"

# Base ontologies (always loaded)
ontologies:
  - name: "@memo/ontology-medical-arch"
    version: "^0.2.0"
  - name: "@memo/ontology-medical-process"
    version: "^0.2.0"

# Optional modules — OWL-style toggleable extensions. Each entry must be
# listed under `optionalModules:` in the base ontology package's memo.package.yaml.
# Uncomment to enable; comment out to turn off (no kinds/rules loaded).
modules:
  - "@memo/ontology-iec62304"        # software lifecycle (classes A/B/C, SOUP)
  # - "@memo/ontology-cybersecurity"          # IEC 81001-5-1 threats/controls
  # - "@memo/ontology-ros"         # ROS 2 (nodes/topics/services)
  # - "@memo/ontology-medical-clinical-trial" # clinical study
  # - "@memo/ontology-clinical-procedure"     # clinical workflow
  # - "@memo/ontology-clinical-interop"       # HL7 FHIR / DICOM
