stages:
  - build
  - test
  - docs

# GitLab runs OpenSysML only: SysIDE needs a licence this runner does not have. Without OPENSYSML_BINARY the
# tests that compile SysML are skipped rather than failed, so the test job sets it and fails if it is missing.
variables:
  MEMO_TOOLCHAIN_COMPILER: opensysml
  MEMO_TEST_COMPILER: opensysml

build:
  stage: build
  image: node:26
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run version:check
    - pnpm run build
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .turbo/

test:
  stage: test
  image: node:26
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - export OPENSYSML_BINARY="$(find "$PWD/node_modules/.pnpm" -path '*opensysml-sysml-grpc-linux-*/bin/sysml-grpc' | head -1)"
    - test -x "$OPENSYSML_BINARY" || { echo "sysml-grpc for this platform was not installed"; exit 1; }
    - pnpm run test
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .turbo/

pages:
  stage: docs
  image: python:3.12-slim
  script:
    - pip install --quiet "mkdocs==1.6.1" "mkdocs-material==9.7.6" "pymdown-extensions==10.21.3"
    - python -m mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
